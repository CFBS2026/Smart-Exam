<!DOCTYPE html><html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A192F">
<title>CFBS Smart Examination System</title><style>
:root{
--bg:#0A192F;
--card:#112240;
--sub:#1D3557;
--gold:#FFD700;
--white:#FFFFFF;
--muted:#8892B0;
--green:#69F0AE;
--red:#ff6b6b;
}
*{box-sizing:border-box}
body{
margin:0;padding:15px;
background:var(--bg);color:var(--white);
font-family:Arial,"Segoe UI",sans-serif;
}
.container{
max-width:850px;margin:auto;padding:20px;
background:var(--card);border:1px solid #806d2a;
border-radius:16px;min-height:90vh;
}
h2,h3,h4{color:var(--gold)}
h2{text-align:center;font-size:21px}
.subtitle{text-align:center;color:var(--muted);font-size:12px;margin-bottom:20px}
label{display:block;margin-top:12px;font-size:14px}
input,select,textarea{
width:100%;padding:12px;margin-top:6px;
background:var(--bg);color:white;
border:1px solid var(--gold);border-radius:8px;
font-size:15px;
}
button{
width:100%;padding:12px;margin-top:10px;
background:var(--gold);color:var(--bg);
border:0;border-radius:8px;font-weight:bold;
font-size:14px;cursor:pointer;
}
button:disabled{opacity:.5}
button.danger{background:var(--red);color:white}
button.secondary{background:#526581;color:white}
button.green{background:var(--green)}
.hidden{display:none!important}
.grid{
display:grid;grid-template-columns:repeat(2,1fr);
gap:10px;margin:12px 0;
}
.menu{
background:var(--sub);padding:17px 12px;
border:1px solid #526581;border-radius:10px;
cursor:pointer;
}
.menu b{display:block;color:white;margin-bottom:5px}
.menu small{color:var(--muted)}
.box{
background:var(--sub);padding:15px;
border-radius:10px;margin:12px 0;
border:1px solid rgba(255,215,0,.25);
}
.section{
color:var(--gold);border-bottom:1px solid #526581;
padding-bottom:7px;margin-top:20px;
}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
th,td{border:1px solid #526581;padding:8px;text-align:left}
th{color:var(--gold)}
.table-wrap{overflow-x:auto}
.option{
display:flex;align-items:center;
background:rgba(255,255,255,.04);
padding:10px;border-radius:7px;margin:7px 0;
}
.option input{width:20px;margin:0 10px 0 0}
.option label{margin:0;flex:1}
.timer{
position:sticky;top:0;background:#FFD700;
color:#0A192F;padding:12px;text-align:center;
font-size:22px;font-weight:bold;border-radius:8px;
z-index:5;
}
.muted{color:var(--muted);font-size:12px}
.stat{
background:#1D3557;padding:12px;border-radius:8px;
text-align:center;
}
.stat strong{display:block;font-size:22px;color:var(--gold)}
@media(max-width:500px){
.container{padding:13px}
.grid{gap:7px}
.menu{padding:13px 8px}
table{font-size:11px}
}
@media print{
body{background:white;color:black}
body *{visibility:hidden}
#printArea,#printArea *{visibility:visible}
#printArea{position:absolute;left:0;top:0;width:100%;color:black;background:white}
}
</style></head><body>
<div class="container"><h2>🦉 CHINDWIN FUTURE BRIGHT SCHOOL</h2>
<div class="subtitle" id="portalSub">SMART EXAMINATION SYSTEM</div><!-- LOGIN --><div id="loginSection">
<div class="box">
<h3 style="text-align:center">အကောင့်ဝင်ရန်</h3><label>Username</label>
<input id="loginUser" autocomplete="username">

<label>Password</label>
<input id="loginPass" type="password" autocomplete="current-password">

<button onclick="handleLogin()">ဝင်မည် (LOGIN)</button>

<p id="loginMsg" style="color:#ff6b6b;text-align:center"></p>
</div>
</div><!-- DASHBOARD --><div id="dashboardSection" class="hidden">
<h3 id="welcomeText" style="text-align:center"></h3>
<div id="roleContent"></div>
<button class="danger" onclick="logout()">Logout / ထွက်ရန်</button>
</div></div><script>
/* =========================================
   CFBS SMART EXAMINATION SYSTEM
   Offline single-device prototype
========================================= */

const KEY={
users:"cfbs_users_v1",
questions:"cfbs_questions_v1",
exams:"cfbs_exams_v1",
results:"cfbs_results_v1",
attempts:"cfbs_attempts_v1"
};

const grades=[
"KG","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5",
"Grade 6","Grade 7","Grade 8","Grade 9",
"Grade 10","Grade 11","Grade 12"
];

const examTypes=[
"ပထမလပတ်",
"ဒုတိယလပတ်",
"တတိယလပတ်",
"စတုတ္ထလပတ်",
"အတန်းတင်စာမေးပွဲ"
];

const combinations={
"Combination 1":["မြန်မာစာ","အင်္ဂလိပ်စာ","သင်္ချာ","ဓာတုဗေဒ","ရူပဗေဒ","ဇီဝဗေဒ"],
"Combination 2":["မြန်မာစာ","အင်္ဂလိပ်စာ","သင်္ချာ","ဓာတုဗေဒ","ရူပဗေဒ","ဘောဂဗေဒ"],
"Combination 3":["မြန်မာစာ","အင်္ဂလိပ်စာ","သင်္ချာ","ပထဝီဝင်","သမိုင်း","ဘောဂဗေဒ"]
};

function subjects(grade,combo){
if(["KG","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5"].includes(grade))
return ["မြန်မာစာ","အင်္ဂလိပ်စာ","သင်္ချာ","လူမှုရေး","သိပ္ပံ"];

if(["Grade 6","Grade 7","Grade 8","Grade 9"].includes(grade))
return ["မြန်မာစာ","အင်္ဂလိပ်စာ","သင်္ချာ","ပထဝီဝင်","သမိုင်း","သိပ္ပံ"];

return combinations[combo]||combinations["Combination 1"];
}

function read(key,def=[]){
try{return JSON.parse(localStorage.getItem(key))||def}
catch(e){return def}
}
function save(key,data){
localStorage.setItem(key,JSON.stringify(data));
}

if(!localStorage.getItem(KEY.users)){
save(KEY.users,[
{user:"principal",pass:"123",role:"principal",name:"ကျောင်းအုပ်ကြီး"},
{user:"teacher",pass:"123",role:"teacher",name:"ဆရာ/မ",grade:"Grade 6",subject:"သင်္ချာ"},
{user:"student",pass:"123",role:"student",name:"မောင်ကျောင်းသား",grade:"Grade 6",roll:"CFBS-001"}
]);
}
if(!localStorage.getItem(KEY.questions))save(KEY.questions,[]);
if(!localStorage.getItem(KEY.exams))save(KEY.exams,[]);
if(!localStorage.getItem(KEY.results))save(KEY.results,[]);
if(!localStorage.getItem(KEY.attempts))save(KEY.attempts,[]);

let currentUser=null;
let activeExam=null;
let timerInterval=null;
let examStart=0;
let remainingSeconds=0;

/* LOGIN */

function handleLogin(){
let u=document.getElementById("loginUser").value.trim();
let p=document.getElementById("loginPass").value;
let user=read(KEY.users).find(x=>x.user===u&&x.pass===p);

if(!user){
document.getElementById("loginMsg").textContent="Username သို့မဟုတ် Password မှားနေပါသည်။";
return;
}

currentUser=user;
document.getElementById("loginSection").classList.add("hidden");
document.getElementById("dashboardSection").classList.remove("hidden");
document.getElementById("welcomeText").textContent="မင်္ဂလာပါ "+user.name;
loadDashboard();
}

function logout(){
if(timerInterval){
alert("စာမေးပွဲဖြေနေစဉ် Logout လုပ်၍မရပါ။");
return;
}
currentUser=null;
document.getElementById("dashboardSection").classList.add("hidden");
document.getElementById("loginSection").classList.remove("hidden");
document.getElementById("loginUser").value="";
document.getElementById("loginPass").value="";
}

/* DASHBOARD */

function loadDashboard(){
let content=document.getElementById("roleContent");
content.innerHTML="";

if(currentUser.role==="principal"){
document.getElementById("portalSub").textContent="PRINCIPAL ADMINISTRATION";

content.innerHTML=`
<div class="grid">
<div class="stat"><strong>${read(KEY.users).filter(x=>x.role==="student").length}</strong>Students</div>
<div class="stat"><strong>${read(KEY.users).filter(x=>x.role==="teacher").length}</strong>Teachers</div>
<div class="stat"><strong>${read(KEY.exams).length}</strong>Examinations</div>
<div class="stat"><strong>${read(KEY.questions).length}</strong>Questions</div>
</div>

<h3>Principal Dashboard</h3>
<div class="grid">
${menu("👥","Student Management","studentMgmt")}
${menu("🎓","Teacher Management","teacherMgmt")}
${menu("📖","Question Bank","questions")}
${menu("✍️","Create Examination","createExam")}
${menu("📋","Examination List","exams")}
${menu("📊","Results & Reports","reports")}
${menu("💾","Backup / Restore","backup")}
</div>
<div id="dynamicView"></div>`;
}
else if(currentUser.role==="teacher"){
document.getElementById("portalSub").textContent="TEACHER PORTAL";

content.innerHTML=`
<div class="box">
<b>တာဝန်အတန်း:</b> ${esc(currentUser.grade||"မသတ်မှတ်ရသေး")}
<br><b>ဘာသာရပ်:</b> ${esc(currentUser.subject||"မသတ်မှတ်ရသေး")}
</div>
<div class="grid">
${menu("👥","Students","studentMgmt")}
${menu("📖","Question Bank","questions")}
${menu("✍️","Create Examination","createExam")}
${menu("📋","Examinations","exams")}
${menu("📊","Exam Results","reports")}
${menu("💾","Backup","backup")}
</div>
<div id="dynamicView"></div>`;
}
else{
document.getElementById("portalSub").textContent="STUDENT EXAM PORTAL";
studentDashboard(content);
}
}

function menu(icon,title,type){
return `<div class="menu" onclick="renderView('${type}')">
<b>${icon} ${title}</b><small>ဖွင့်ရန် နှိပ်ပါ</small></div>`;
}

/* STUDENT DASHBOARD */

function studentDashboard(content){
let u=currentUser;
let sub=subjects(u.grade,u.combo);

content.innerHTML=`
<div class="box">
<h3>ကျောင်းသားအချက်အလက်</h3>
<p>အမည်: ${esc(u.name)}</p>
<p>အတန်း: ${esc(u.grade)}</p>
<p>Student ID: ${esc(u.roll||"-")}</p>
<p>ဘာသာတွဲ: ${esc(u.combo||"-")}</p>
</div>

<div class="box">
<h3>စာမေးပွဲများ</h3>
<div id="studentExamList"></div>
</div>

<div class="grid">
${menu("📊","My Results","myResults")}
${menu("👤","My Profile","profile")}
</div>
<div id="dynamicView"></div>`;

let exams=read(KEY.exams).filter(e=>
e.grade===u.grade&&sub.includes(e.subject)&&e.active!==false
);

let attempts=read(KEY.attempts);
let html="";

if(!exams.length)html="<p>စာမေးပွဲ မရှိသေးပါ။</p>";

exams.forEach(e=>{
let done=attempts.some(a=>a.examId===e.id&&a.student===u.user);
html+=`
<div class="box">
<b>${esc(e.title)}</b>
<p>${esc(e.subject)} | ${esc(e.type)}</p>
<p>အမှတ်: ${e.total} | အချိန်: ${e.minutes} မိနစ်</p>
<button ${done?"disabled":""} onclick="attemptQuiz('${e.id}')">
${done?"ဖြေဆိုပြီးပါပြီ":"🚀 Attempt Quiz"}
</button>
</div>`;
});

document.getElementById("studentExamList").innerHTML=html;
}

/* VIEW ROUTER */

function renderView(type){
let view=document.getElementById("dynamicView");
if(!view)return;

if(type==="studentMgmt")studentManagement(view);
if(type==="teacherMgmt")teacherManagement(view);
if(type==="questions")questionManagement(view);
if(type==="createExam")createExamView(view);
if(type==="exams")examListView(view);
if(type==="reports"||type==="myResults")resultsView(view,type);
if(type==="backup")backupView(view);
if(type==="profile")profileView(view);
}

/* STUDENT MANAGEMENT */

function studentManagement(view){
if(currentUser.role!=="principal"&&currentUser.role!=="teacher"){
view.innerHTML="ခွင့်ပြုချက်မရှိပါ။";return;
}

let list=read(KEY.users).filter(u=>u.role==="student");

view.innerHTML=`
<div class="box">
<h3>ကျောင်းသားအကောင့်ဖန်တီးရန်</h3>
<label>Username</label><input id="su">
<label>Password</label><input id="sp">
<label>အမည်</label><input id="sn">
<label>Student ID</label><input id="sr">
<label>အတန်း</label>
<select id="sg">${gradeOptions()}</select>
<label>Grade 10–12 ဘာသာတွဲ</label>
<select id="sc">
<option value="">မသတ်မှတ်ပါ</option>
${Object.keys(combinations).map(c=>`<option>${c}</option>`).join("")}
</select>
<button onclick="createStudent()">အကောင့်ဖန်တီးမည်</button>
</div>
<h3>ကျောင်းသားစာရင်း (${list.length})</h3>
<div class="table-wrap"><table>
<tr><th>အမည်</th><th>Username</th><th>အတန်း</th><th>လုပ်ဆောင်ချက်</th></tr>
${list.map(u=>`<tr>
<td>${esc(u.name)}</td><td>${esc(u.user)}</td><td>${esc(u.grade)}</td>
<td><button class="danger" onclick="deleteUser('${u.user}')">ဖျက်</button></td>
</tr>`).join("")}
</table></div>`;
}

function createStudent(){
let u=document.getElementById("su").value.trim();
let p=document.getElementById("sp").value;
let n=document.getElementById("sn").value.trim();
let r=document.getElementById("sr").value.trim();
let g=document.getElementById("sg").value;
let c=document.getElementById("sc").value;

if(!u||!p||!n||!r){alert("အချက်အလက်အားလုံး ဖြည့်ပါ။");return;}
let users=read(KEY.users);
if(users.some(x=>x.user===u)){alert("Username ရှိပြီးသားပါ။");return;}

users.push({user:u,pass:p,name:n,roll:r,grade:g,combo:c,role:"student"});
save(KEY.users,users);
alert("ကျောင်းသားအကောင့် ဖန်တီးပြီးပါပြီ။");
renderView("studentMgmt");
}

/* TEACHER MANAGEMENT */

function teacherManagement(view){
if(currentUser.role!=="principal"){
view.innerHTML="Principal သာ ဆရာ/မအကောင့် ဖန်တီးနိုင်ပါသည်။";return;
}

let list=read(KEY.users).filter(u=>u.role==="teacher");

view.innerHTML=`
<div class="box">
<h3>ဆရာ/မအကောင့်ဖန်တီးရန်</h3>
<label>Username</label><input id="tu">
<label>Password</label><input id="tp">
<label>အမည်</label><input id="tn">
<label>တာဝန်အတန်း</label><select id="tg">${gradeOptions()}</select>
<label>တာဝန်ဘာသာရပ်</label><input id="ts">
<button onclick="createTeacher()">ဖန်တီးမည်</button>
</div>
<h3>ဆရာ/မစာရင်း</h3>
<div class="table-wrap"><table>
<tr><th>အမည်</th><th>အတန်း</th><th>ဘာသာရပ်</th><th>လုပ်ဆောင်ချက်</th></tr>
${list.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.grade)}</td>
<td>${esc(t.subject)}</td><td><button class="danger" onclick="deleteUser('${t.user}')">ဖျက်</button></td></tr>`).join("")}
</table></div>`;
}

function createTeacher(){
let u=document.getElementById("tu").value.trim();
let p=document.getElementById("tp").value;
let n=document.getElementById("tn").value.trim();
let g=document.getElementById("tg").value;
let s=document.getElementById("ts").value.trim();

if(!u||!p||!n||!s){alert("အချက်အလက်ဖြည့်ပါ။");return;}
let users=read(KEY.users);
if(users.some(x=>x.user===u)){alert("Username ရှိပြီးသားပါ။");return;}
users.push({user:u,pass:p,name:n,grade:g,subject:s,role:"teacher"});
save(KEY.users,users);
alert("ဆရာ/မအကောင့် ဖန်တီးပြီးပါပြီ။");
renderView("teacherMgmt");
}

function deleteUser(username){
if(!confirm("ဤအကောင့်ကို ဖျက်မှာ သေချာပါသလား။"))return;
save(KEY.users,read(KEY.users).filter(u=>u.user!==username));
renderView(currentUser.role==="principal"?"studentMgmt":"studentMgmt");
}

/* QUESTION BANK */

function questionManagement(view){
let all=read(KEY.questions);
let teacher=currentUser.role==="teacher";

view.innerHTML=`
<div class="box">
<h3>မေးခွန်းအသစ်ထည့်ရန်</h3>
<label>အတန်း</label>
<select id="qg" onchange="questionSubjects()">
${gradeOptions(teacher?currentUser.grade:null)}
</select>
<label>ဘာသာရပ်</label><select id="qs"></select>
<label>Chapter</label><input id="qc" placeholder="ဥပမာ Chapter 1">
<label>မေးခွန်း</label><textarea id="qq" rows="3"></textarea><label>Option A</label><input id="qa">
<label>Option B</label><input id="qb">
<label>Option C</label><input id="qcc">
<label>Option D</label><input id="qd">
<label>အဖြေမှန်</label>
<select id="qans">

<option>A</option><option>B</option><option>C</option><option>D</option>
</select>
<button onclick="saveQuestion()">မေးခွန်းသိမ်းမည်</button>
</div>
<h3>မေးခွန်းစာရင်း (${all.length})</h3>
<div id="questionList"></div>`;questionSubjects();
showQuestions();
}

function questionSubjects(){
let g=document.getElementById("qg");
let s=document.getElementById("qs");
if(!g||!s)return;
let list=subjects(g.value);
s.innerHTML=list.map(x=>"<option>${x}</option>").join("");
}

function saveQuestion(){
let g=document.getElementById("qg").value;
let s=document.getElementById("qs").value;
let c=document.getElementById("qc").value.trim();
let q=document.getElementById("qq").value.trim();
let a=document.getElementById("qa").value.trim();
let b=document.getElementById("qb").value.trim();
let cc=document.getElementById("qcc").value.trim();
let d=document.getElementById("qd").value.trim();
let ans=document.getElementById("qans").value;

if(!q||!c||!a||!b||!cc||!d){alert("အချက်အလက်အားလုံး ဖြည့်ပါ။");return;}

let qs=read(KEY.questions);
qs.push({id:makeId(),grade:g,subject:s,chapter:c,q,optA:a,optB:b,optC:cc,optD:d,ans,owner:currentUser.user});
save(KEY.questions,qs);
alert("မေးခွန်း သိမ်းဆည်းပြီးပါပြီ။");
renderView("questions");
}

function showQuestions(){
let qs=read(KEY.questions);
let list=document.getElementById("questionList");
if(!list)return;
list.innerHTML=qs.map((q,i)=>`

<div class="box">
<b>${i+1}. ${esc(q.grade)} / ${esc(q.subject)} / ${esc(q.chapter)}</b>
<p>${esc(q.q)}</p>
<p class="muted">A. ${esc(q.optA)} | B. ${esc(q.optB)} | C. ${esc(q.optC)} | D. ${esc(q.optD)}</p>
<p>အဖြေမှန်: ${esc(q.ans)}</p>
<button class="danger" onclick="deleteQuestion('${q.id}')">ဖျက်မည်</button>
</div>`).join("");
}function deleteQuestion(id){
if(!confirm("မေးခွန်းဖျက်မလား။"))return;
save(KEY.questions,read(KEY.questions).filter(q=>q.id!==id));
renderView("questions");
}

/* CREATE EXAM */

function createExamView(view){
let g=currentUser.role==="teacher"?currentUser.grade:"Grade 6";
view.innerHTML=`

<div class="box">
<h3>စာမေးပွဲဖန်တီးရန်</h3>
<label>စာမေးပွဲအမည်</label><input id="etitle" placeholder="ဥပမာ ပထမလပတ်စာမေးပွဲ">
<label>အတန်း</label>
<select id="eg" onchange="examSubjects()">${gradeOptions(currentUser.role==="teacher"?currentUser.grade:null)}</select>
<label>ဘာသာရပ်</label><select id="es"></select>
<label>စာမေးပွဲအမျိုးအစား</label>

function examSubjects(){
let g=document.getElementById("eg");
let s=document.getElementById("es");
if(!g||!s)return;
s.innerHTML=subjects(g.value,currentUser.combo).map(x=>"<option>${x}</option>").join("");
s.onchange=updateChapterChoices;
g.onchange=()=>{examSubjects();updateChapterChoices();};
updateChapterChoices();
}

function updateChapterChoices(){
let g=document.getElementById("eg").value;
let s=document.getElementById("es").value;
let qs=read(KEY.questions).filter(q=>q.grade===g&&q.subject===s);
let chapters=[...new Set(qs.map(q=>q.chapter))];

document.getElementById("chapterChoices").innerHTML=chapters.length?
chapters.map(c=>"<label><input type="checkbox" class="chapterCheck" value="${esc(c)}" checked style="width:auto"> ${esc(c)}</label>").join("")
:"ဤဘာသာရပ်အတွက် မေးခွန်းမရှိသေးပါ။";
}

function createExam(){
let title=document.getElementById("etitle").value.trim();
let grade=document.getElementById("eg").value;
let subject=document.getElementById("es").value;
let type=document.getElementById("etype").value;
let total=Number(document.getElementById("emarks").value);
let minutes=Number(document.getElementById("eminutes").value);
let count=Number(document.getElementById("ecount").value);
let chapters=[...document.querySelectorAll(".chapterCheck:checked")].map(x=>x.value);

if(!title||!chapters.length){alert("စာမေးပွဲအမည်နှင့် Chapter ရွေးချယ်ပါ။");return;}

let qs=read(KEY.questions).filter(q=>
q.grade===grade&&q.subject===subject&&chapters.includes(q.chapter)
);

if(qs.length<count){
alert("ရွေးထားသော Chapter များတွင် မေးခွန်း ${qs.length} ပုဒ်သာ ရှိပါသည်။ ${count} ပုဒ်လိုအပ်ပါသည်။");
return;
}

let exam={
id:makeId(),title,grade,subject,type,total,minutes,count,
chapters,active:true,owner:currentUser.user
};

let exams=read(KEY.exams);
exams.push(exam);
save(KEY.exams,exams);
alert("စာမေးပွဲဖန်တီးပြီးပါပြီ။");
renderView("exams");
}

/* ATTEMPT QUIZ */

function attemptQuiz(id){
let exam=read(KEY.exams).find(e=>e.id===id);
if(!exam||!exam.active)return;

let attempts=read(KEY.attempts);
if(attempts.some(a=>a.examId===id&&a.student===currentUser.user)){
alert("ဤစာမေးပွဲကို ဖြေဆိုပြီးပါပြီ။");
return;
}

let qs=read(KEY.questions).filter(q=>
q.grade===exam.grade&&q.subject===exam.subject&&exam.chapters.includes(q.chapter)
);

qs=shuffle(qs).slice(0,exam.count);

if(qs.length!==exam.count){
alert("မေးခွန်းအရေအတွက် မပြည့်စုံပါ။");
return;
}

activeExam={exam,questions:qs,answers:{},start:Date.now()};
examStart=Date.now();
remainingSeconds=exam.minutes*60;

save(KEY.attempts,[...attempts,{
examId:id,student:currentUser.user,status:"started",
start:examStart
}]);

renderQuiz();
}

</div>`).join("");startTimer();

function startTimer(){
clearInterval(timerInterval);
updateTimer();
timerInterval=setInterval(()=>{
remainingSeconds--;
updateTimer();
if(remainingSeconds<=0){
clearInterval(timerInterval);
timerInterval=null;
finishExam(true);
}
},1000);
}

function updateTimer(){
let m=Math.floor(remainingSeconds/60);
let s=remainingSeconds%60;
let el=document.getElementById("timer");
if(el)el.textContent=
String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function backupView(view){
view.innerHTML=`

<div class="box">
<h3>Database Backup / Restore</h3>
<p>CFBS Data များကို JSON ဖိုင်အဖြစ် သိမ်းဆည်းနိုင်ပါသည်။</p>

<label>Backup ဖိုင်ပြန်ထည့်ရန်</label>
<input type="file" id="backupFile" accept=".json">
<button onclick="restoreBackup()">Restore Database</button>
</div>`;
}function exportBackup(){
let data={};
Object.values(KEY).forEach(k=>data[k]=read(k));
let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
downloadBlob(blob,"CFBS_Exam_Backup.json");
}

function restoreBackup(){
let file=document.getElementById("backupFile").files[0];
if(!file){alert("Backup ဖိုင်ရွေးပါ။");return;}
let reader=new FileReader();
reader.onload=()=>{
try{
let data=JSON.parse(reader.result);
Object.values(KEY).forEach(k=>{
if(data[k]!==undefined)localStorage.setItem(k,JSON.stringify(data[k]));
});
alert("Restore ပြီးပါပြီ။ App ကို ပြန်ဖွင့်ပါ။");
location.reload();
}catch(e){alert("Backup ဖိုင် မှားယွင်းနေပါသည်။");}
};
reader.readAsText(file);
}

/* HELPERS */

function gradeOptions(selected){
return grades.filter(g=>!selected||g===selected)
.map(g=>"<option>${g}</option>").join("");
}

function makeId(){
return "CFBS-"+Date.now()+"-"+Math.floor(Math.random()*10000);
}

function shuffle(arr){
let a=[...arr];
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&","<":"<",">":">",
'"':""","'":"'"
}[c]));
}

function formatDuration(sec){
let h=Math.floor(sec/3600);
let m=Math.floor((sec%3600)/60);
let s=sec%60;
if(h)return "${h} နာရီ ${m} မိနစ်";
if(m)return "${m} မိနစ် ${s} စက္ကန့်";
return "${s} စက္ကန့်";
}

function downloadBlob(blob,name){
let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;a.download=name;a.click();
URL.revokeObjectURL(url);
}
