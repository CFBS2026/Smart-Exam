<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINDWIN FUTURE BRIGHT SCHOOL - Smart Exam System</title>

    <!-- Tesseract.js (Client-side OCR Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0A192F;
            --card-bg: #112240;
            --card-sub: #1D3557;
            --accent-color: #FFD700;
            --text-color: #FFFFFF;
            --text-muted: #8892B0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h2, h3, h4 {
            color: var(--accent-color);
            text-align: center;
            margin-top: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            background-color: #0A192F;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { opacity: 0.9; }
        .hidden { display: none; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .menu-card {
            background: var(--card-sub);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.2);
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .menu-card h4 {
            margin: 0 0 4px 0;
            color: #FFFFFF;
            font-size: 14px;
        }
        .menu-card p {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
        }
        .section-title {
            color: var(--accent-color);
            font-size: 15px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            padding-bottom: 5px;
            margin: 20px 0 10px 0;
        }
        .card-box {
            background: var(--card-sub);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .ocr-box {
            border: 2px dashed var(--accent-color);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(255,215,0,0.05);
        }
        .receipt {
            background: #fff;
            color: #000;
            padding: 15px;
            font-family: monospace;
            border-radius: 8px;
            white-space: pre-wrap;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CHINDWIN FUTURE BRIGHT SCHOOL</h2>
    <div class="subtitle" id="portalSub">SMART EXAMINATION SYSTEM</div>

    <!-- 1. Login Section -->
    <div id="loginSection">
        <h3>အကောင့်ဝင်ရန် (Login)</h3>
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="principal / teacher / student">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="123">
        <button onclick="handleLogin()">ဝင်မည် (Login)</button>
        <p id="loginMsg" style="color: #ff6b6b; text-align: center;"></p>
    </div>

    <!-- 2. Dashboard Section -->
    <div id="dashboardSection" class="hidden">
        <h3 id="welcomeText" style="color: #69F0AE;"></h3>
        <div id="roleContent"></div>
        <button onclick="logout()" style="background-color: #ff6b6b; color: #fff; margin-top: 25px;">ထွက်ရန် (Logout)</button>
    </div>
</div>

<script>
    // Database Setup
    if (!localStorage.getItem('users')) {
        localStorage.setItem('users', JSON.stringify([
            {user: 'principal', pass: '123', role: 'principal', name: 'ကျောင်းအုပ်ကြီး'},
            {user: 'teacher', pass: '123', role: 'teacher', name: 'ဦးဆောင်ဆရာမ'},
            {user: 'student', pass: '123', role: 'student', name: 'မောင်ကျောင်းသား'}
        ]));
    }
    if (!localStorage.getItem('questions')) localStorage.setItem('questions', JSON.stringify([]));
    if (!localStorage.getItem('results')) localStorage.setItem('results', JSON.stringify([]));

    let currentUser = null;

    function handleLogin() {
        let u = document.getElementById('loginUser').value.trim();
        let p = document.getElementById('loginPass').value.trim();
        let users = JSON.parse(localStorage.getItem('users'));

        let found = users.find(x => x.user === u && x.pass === p);
        if (found) {
            currentUser = found;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('welcomeText').innerText = `မင်္ဂလာပါ၊ ${currentUser.name} (${currentUser.role.toUpperCase()})`;
            loadDashboard();
        } else {
            document.getElementById('loginMsg').innerText = 'Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။';
        }
    }

    function loadDashboard() {
        let content = document.getElementById('roleContent');
        content.innerHTML = '';

        if (currentUser.role === 'principal' || currentUser.role === 'teacher') {
            document.getElementById('portalSub').innerText = currentUser.role.toUpperCase() + ' PANEL';
            content.innerHTML = `
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('questions')"><h4>📷 Question Bank (OCR)</h4><p>ပုံဖြင့် မေးခွန်းဖတ်ရန်</p></div>
                    <div class="menu-card" onclick="renderView('reports')"><h4>📊 Exam Results</h4><p>စာမေးပွဲ ရလဒ်</p></div>
                </div>
                <div id="dynamicView"></div>
            `;
            renderView('questions');
        } else {
            document.getElementById('portalSub').innerText = 'STUDENT EXAM PORTAL';
            content.innerHTML = `
                <div class="card-box">
                    <h4>Available Exam: Mathematics</h4>
                    <button onclick="startExam()">စာမေးပွဲ ဖြေဆိုမည်</button>
                </div>
                <div id="dynamicView"></div>
            `;
        }
    }

    function renderView(type) {
        let view = document.getElementById('dynamicView');
        if (type === 'questions') {
            let qs = JSON.parse(localStorage.getItem('questions'));
            let html = `
                <div class="card-box">
                    <h4>📖 Question Bank (OCR Photo Scan)</h4>
                    
                    <div class="ocr-box">
                        <label><b>📷 မေးခွန်း ဓာတ်ပုံ တင်ရန် (OCR Scan)</b></label><br><br>
                        <input type="file" id="ocrImg" accept="image/*" onchange="processOCR()">
                        <p id="ocrStatus" style="font-size:12px; color:var(--accent-color); margin-top:8px;"></p>
                    </div>

                    <label>မေးခွန်း စာသား</label>
                    <textarea id="newQ" rows="3" placeholder="မေးခွန်း စာသား (ပုံမှ OCR ဖတ်ယူထားသော စာသားများ အလိုအလျောက် ပေါ်လာပါမည်)"></textarea>
                    
                    <input type="text" id="optA" placeholder="Option A">
                    <input type="text" id="optB" placeholder="Option B">
                    <input type="text" id="ansVal" placeholder="အမှန်ဖြေ (A သို့မဟုတ် B)">
                    
                    <button onclick="addQuestion()">မေးခွန်း သိမ်းဆည်းမည်</button>
                    
                    <h4 style="margin-top:20px;">ရှိပြီးသား မေးခွန်းများ</h4>
                    <ul>`;
            qs.forEach((q, i) => { html += `<li><b>${i+1}. ${q.q}</b><br>A) ${q.optA} | B) ${q.optB} [အမှန်: ${q.ans}]</li><br>`; });
            html += `</ul></div>`;
            view.innerHTML = html;
        } else if (type === 'reports') {
            let res = JSON.parse(localStorage.getItem('results'));
            let html = `<div class="card-box"><h4>📊 စာမေးပွဲ ရလဒ်များ</h4><ul>`;
            res.forEach(r => { html += `<li>${r.student} - ${r.score}/${r.total} (${r.grade}) [${r.date}]</li>`; });
            html += `</ul></div>`;
            view.innerHTML = html;
        }
    }

    // --- OCR Image Processing Engine ---
    function processOCR() {
        let fileInput = document.getElementById('ocrImg');
        let status = document.getElementById('ocrStatus');
        let qArea = document.getElementById('newQ');

        if (fileInput.files.length === 0) return;

        let file = fileInput.files[0];
        status.innerText = '⏳ ပုံထဲမှ မေးခွန်း စာသားများကို OCR ဖတ်ယူနေပါသည်။ ခေတ္တစောင့်ပါ...';

        Tesseract.recognize(
            file,
            'eng', // အင်္ဂလိပ်စာ အဓိက Scan ဖတ်ရန်
            { logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဖတ်ယူနေမှု: ${Math.round(m.progress * 100)}%`; } }
        ).then(({ data: { text } }) => {
            status.innerText = '✅ OCR စာသား ဖတ်ယူခြင်း အောင်မြင်ပါသည်။';
            qArea.value = text.trim();
        }).catch(err => {
            status.innerText = '❌ စာသား ဖတ်ယူရာတွင် အမှားအယွင်း ရှိနေပါသည်။';
            console.error(err);
        });
    }

    function addQuestion() {
        let q = document.getElementById('newQ').value;
        let optA = document.getElementById('optA').value;
        let optB = document.getElementById('optB').value;
        let ans = document.getElementById('ansVal').value.toUpperCase();
        if(!q) { alert('မေးခွန်းဖြည့်ပါ။'); return; }
        let qs = JSON.parse(localStorage.getItem('questions'));
        qs.push({q, optA, optB, ans});
        localStorage.setItem('questions', JSON.stringify(qs));
        alert('မေးခွန်း အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။');
        renderView('questions');
    }

    function startExam() {
        let qs = JSON.parse(localStorage.getItem('questions'));
        if(qs.length === 0) { alert('မေးခွန်း မရှိသေးပါ။ ဆရာ/မ ကို အကြောင်းကြားပါ။'); return; }
        
        let q = qs[0];
        document.getElementById('roleContent').innerHTML = `
            <div class="card-box">
                <h3>Mathematics Exam</h3>
                <p><b>မေးခွန်း။</b> ${q.q}</p>
                <label><input type="radio" name="ans" value="A"> A) ${q.optA}</label><br><br>
                <label><input type="radio" name="ans" value="B"> B) ${q.optB}</label><br><br>
                <button onclick="submitExam()">အဖြေတင်သွင်းမည်</button>
            </div>
        `;
    }

    function submitExam() {
        let dateStr = new Date().toLocaleDateString();
        let results = JSON.parse(localStorage.getItem('results'));
        results.push({ student: currentUser.name, score: 50, total: 50, grade: 'A+', date: dateStr });
        localStorage.setItem('results', JSON.stringify(results));

        let slip = `CHINDWIN FUTURE BRIGHT SCHOOL
--------------------------------
EXAM RESULT SLIP
--------------------------------
Student : ${currentUser.name}
Score   : 50 / 50
Grade   : A+
Date    : ${dateStr}
--------------------------------`;

        document.getElementById('roleContent').innerHTML = `
            <p style="color: #69F0AE; text-align: center; font-weight: bold;">စာမေးပွဲ ဖြေဆိုပြီးစီးပါပြီ!</p>
            <div class="receipt">${slip}</div>
            <button onclick="window.print()" style="background-color: #69F0AE; color: #0A192F;">🖨️ 2-inch Thermal Printer ဖြင့် Print ထုတ်မည်</button>
            <button onclick="loadDashboard()" style="margin-top:10px;">ပင်မစာမျက်နှာသို့ ပြန်ရန်</button>
        `;
    }

    function logout() {
        currentUser = null;
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginMsg').innerText = '';
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }
</script>

</body>
</html>
