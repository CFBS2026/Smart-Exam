<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINDWIN FUTURE BRIGHT SCHOOL - Smart Exam System</title>

    <!-- Tesseract.js (OCR Library) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0A192F;
            --card-bg: #112240;
            --card-sub: #1D3557;
            --accent-color: #FFD700;
            --text-color: #FFFFFF;
            --text-muted: #8892B0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h2, h3, h4 {
            color: var(--accent-color);
            text-align: center;
            margin-top: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            background-color: #0A192F;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { opacity: 0.9; }
        .hidden { display: none !important; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .menu-card {
            background: var(--card-sub);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.2);
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .menu-card h4 {
            margin: 0 0 4px 0;
            color: #FFFFFF;
            font-size: 14px;
        }
        .menu-card p {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
        }
        .card-box {
            background: var(--card-sub);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .ocr-box {
            border: 2px dashed var(--accent-color);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(255,215,0,0.05);
        }
        .q-preview-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--accent-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .receipt {
            background: #fff;
            color: #000;
            padding: 15px;
            font-family: monospace;
            border-radius: 8px;
            white-space: pre-wrap;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CHINDWIN FUTURE BRIGHT SCHOOL</h2>
    <div class="subtitle" id="portalSub">SMART EXAMINATION SYSTEM</div>

    <!-- 1. Login Section -->
    <div id="loginSection">
        <h3>အကောင့်ဝင်ရန် (Login)</h3>
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="principal / teacher / student">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="123">
        <button onclick="handleLogin()">ဝင်မည် (Login)</button>
        <p id="loginMsg" style="color: #ff6b6b; text-align: center;"></p>
    </div>

    <!-- 2. Dashboard Section -->
    <div id="dashboardSection" class="hidden">
        <h3 id="welcomeText" style="color: #69F0AE;"></h3>
        <div id="roleContent"></div>
        <button onclick="logout()" style="background-color: #ff6b6b; color: #fff; margin-top: 25px;">ထွက်ရန် (Logout)</button>
    </div>
</div>

<script>
    // System Users & Initial Setup
    if (!localStorage.getItem('users')) {
        localStorage.setItem('users', JSON.stringify([
            {user: 'principal', pass: '123', role: 'principal', name: 'ကျောင်းအုပ်ကြီး (Principal)'},
            {user: 'teacher', pass: '123', role: 'teacher', name: 'ဦးဆောင်ဆရာမ (Teacher)'},
            {user: 'student', pass: '123', role: 'student', name: 'မောင်ကျောင်းသား (Student)'}
        ]));
    }
    if (!localStorage.getItem('questions_v6')) {
        localStorage.setItem('questions_v6', JSON.stringify([
            {q: 'The equation of the sphere is x^2 + y^2 + z^2 + 6x - 2y + 2z - 5 = 0. Then the radius is?', optA: '3', optB: '4', optC: '5', optD: '6', ans: 'A'}
        ]));
    }
    if (!localStorage.getItem('results')) localStorage.setItem('results', JSON.stringify([]));

    let currentUser = null;

    function handleLogin() {
        let u = document.getElementById('loginUser').value.trim();
        let p = document.getElementById('loginPass').value.trim();
        let users = JSON.parse(localStorage.getItem('users'));

        let found = users.find(x => x.user === u && x.pass === p);
        if (found) {
            currentUser = found;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('welcomeText').innerText = `မင်္ဂလာပါ၊ ${currentUser.name}`;
            loadDashboard();
        } else {
            document.getElementById('loginMsg').innerText = 'Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။';
        }
    }

    function loadDashboard() {
        let content = document.getElementById('roleContent');
        content.innerHTML = '';

        if (currentUser.role === 'principal' || currentUser.role === 'teacher') {
            document.getElementById('portalSub').innerText = currentUser.role.toUpperCase() + ' DASHBOARD';
            content.innerHTML = `
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('questions')"><h4>📷 Question Bank (OCR)</h4><p>Google Form ပုံစံ မေးခွန်းထည့်ရန်</p></div>
                    <div class="menu-card" onclick="renderView('reports')"><h4>📊 Exam Results</h4><p>စာမေးပွဲ ရလဒ်များ</p></div>
                </div>
                <div id="dynamicView"></div>
            `;
            renderView('questions');
        } else {
            document.getElementById('portalSub').innerText = 'STUDENT EXAM PORTAL';
            content.innerHTML = `
                <div class="card-box">
                    <h4>Available Exam: Mathematics (Grade 12)</h4>
                    <p style="font-size:12px; color:var(--text-muted);">Google Form ပုံစံ စာမေးပွဲ ဖြေဆိုရန်</p>
                    <button onclick="startExam()">စာမေးပွဲ စတင်ဖြေဆိုမည်</button>
                </div>
                <div id="dynamicView"></div>
            `;
        }
    }

    function renderView(type) {
        let view = document.getElementById('dynamicView');
        if (type === 'questions') {
            let qs = JSON.parse(localStorage.getItem('questions_v6')) || [];
            let html = `
                <div class="card-box">
                    <h4>📖 Google Form ပုံစံ မေးခွန်းဖန်တီးရန် (Smart OCR)</h4>
                    
                    <div class="ocr-box">
                        <label><b>📷 မေးခွန်းပါသော ဓာတ်ပုံ တင်ပါ</b></label><br><br>
                        <input type="file" id="ocrImg" accept="image/*" onchange="processSmartOCR()">
                        <p id="ocrStatus" style="font-size:12px; color:var(--accent-color); margin-top:8px;"></p>
                    </div>

                    <label><b>မေးခွန်း (Question)</b></label>
                    <textarea id="qText" rows="3" placeholder="မေးခွန်းစာသား"></textarea>
                    
                    <label><b>Option A</b></label><input type="text" id="qOptA" placeholder="Option A">
                    <label><b>Option B</b></label><input type="text" id="qOptB" placeholder="Option B">
                    <label><b>Option C</b></label><input type="text" id="qOptC" placeholder="Option C">
                    <label><b>Option D</b></label><input type="text" id="qOptD" placeholder="Option D">

                    <label><b>မှန်ကန်သော အဖြေ (Correct Answer)</b></label>
                    <select id="qAns">
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                    
                    <button onclick="saveFormQuestion()">➕ မေးခွန်း သိမ်းဆည်းမည်</button>
                    <button onclick="clearQuestionBank()" style="background:#ff6b6b; color:#fff; margin-top:5px;">မေးခွန်းဟောင်းများ အကုန်ဖျက်မည်</button>
                    
                    <h4 style="margin-top:20px; text-align:left;">သိမ်းဆည်းထားသော မေးခွန်းများ (${qs.length})</h4>
                    <div id="qList">`;
            
            qs.forEach((q, i) => { 
                html += `
                    <div class="q-preview-card">
                        <b>မေးခွန်း ${i+1}:</b> ${escapeHtml(q.q)}<br>
                        <div style="margin-top:8px; font-size:13px; color:var(--text-muted);">
                            🔘 A) ${escapeHtml(q.optA || '-')}<br>
                            🔘 B) ${escapeHtml(q.optB || '-')}<br>
                            🔘 C) ${escapeHtml(q.optC || '-')}<br>
                            🔘 D) ${escapeHtml(q.optD || '-')}<br>
                            <b style="color:#69F0AE; display:inline-block; margin-top:5px;">အမှန်ဖြေ: Option ${q.ans}</b>
                        </div>
                    </div>`; 
            });
            html += `</div></div>`;
            view.innerHTML = html;
        } else if (type === 'reports') {
            let res = JSON.parse(localStorage.getItem('results'));
            let html = `<div class="card-box"><h4>📊 စာမေးပွဲ ရလဒ်များ</h4>`;
            if (res.length === 0) { html += `<p style="text-align:center;">မှတ်တမ်း မရှိသေးပါ။</p>`; }
            else {
                res.forEach(r => { html += `<div class="q-preview-card"><b>${r.student}</b> - ရမှတ်: ${r.score}/${r.total} (${r.grade}) <br><small>${r.date}</small></div>`; });
            }
            html += `</div>`;
            view.innerHTML = html;
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // --- Smart OCR Parser (Isolates Question & Options A, B, C, D) ---
    function processSmartOCR() {
        let fileInput = document.getElementById('ocrImg');
        let status = document.getElementById('ocrStatus');

        if (fileInput.files.length === 0) return;

        let file = fileInput.files[0];
        status.innerText = '⏳ ပုံထဲမှ စာသားများကို Smart OCR ဖြင့် ခွဲခြမ်းစိတ်ဖြာနေပါသည်...';

        Tesseract.recognize(
            file,
            'eng',
            { logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဖတ်ယူနေမှု: ${Math.round(m.progress * 100)}%`; } }
        ).then(({ data: { text } }) => {
            status.innerText = '✅ မေးခွန်းနှင့် Options များ သီးသန့် ကွဲထွက်သွားပါပြီ။';
            
            // Normalize spaces and split by common option patterns (A., B., C., D. or A) B) C) D))
            let cleanText = text.replace(/\r\n/g, '\n').replace(/\n+/g, ' ');
            
            let qPart = cleanText;
            let optA = '', optB = '', optC = '', optD = '';

            // Regex to extract A, B, C, D segments
            let matchA = qTextMatch(cleanText, /(?:[^\w]|^)[aA][\.\)]\s*(.*?)(?=(?:[^\w]|^)[bB][\.\)]|$)/);
            let matchB = qTextMatch(cleanText, /(?:[^\w]|^)[bB][\.\)]\s*(.*?)(?=(?:[^\w]|^)[cC][\.\)]|$)/);
            let matchC = qTextMatch(cleanText, /(?:[^\w]|^)[cC][\.\)]\s*(.*?)(?=(?:[^\w]|^)[dD][\.\)]|$)/);
            let matchD = qTextMatch(cleanText, /(?:[^\w]|^)[dD][\.\)]\s*(.*?)$/);

            if (matchA) optA = matchA.trim();
            if (matchB) optB = matchB.trim();
            if (matchC) optC = matchC.trim();
            if (matchD) optD = matchD.trim();

            // Extract question by removing the options part
            let mainQuestion = cleanText.split(/([aA][\.\)]|[bB][\.\)]|[cC][\.\)]|[dD][\.\)])/)[0].trim();

            document.getElementById('qText').value = mainQuestion || cleanText;
            document.getElementById('qOptA').value = optA;
            document.getElementById('qOptB').value = optB;
            document.getElementById('qOptC').value = optC;
            document.getElementById('qOptD').value = optD;

        }).catch(err => {
            status.innerText = '❌ စာသား ဖတ်ယူရာတွင် အမှားအယွင်း ရှိနေပါသည်။';
            console.error(err);
        });
    }

    function qTextMatch(text, regex) {
        let m = text.match(regex);
        return m ? m[1] : '';
    }

    function saveFormQuestion() {
        let q = document.getElementById('qText').value.trim();
        let optA = document.getElementById('qOptA').value.trim();
        let optB = document.getElementById('qOptB').value.trim();
        let optC = document.getElementById('qOptC').value.trim();
        let optD = document.getElementById('qOptD').value.trim();
        let ans = document.getElementById('qAns').value;
        
        if(!q) { alert('မေးခွန်း စာသား ဖြည့်ပါ။'); return; }
        
        let qs = JSON.parse(localStorage.getItem('questions_v6')) || [];
        qs.push({q, optA, optB, optC, optD, ans});
        localStorage.setItem('questions_v6', JSON.stringify(qs));
        
        alert('မေးခွန်း အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။');
        renderView('questions');
    }

    function clearQuestionBank() {
        if(confirm('မေးခွန်းများ အားလုံးကို ဖျက်ပစ်ရန် သေချာပါသလား?')) {
            localStorage.setItem('questions_v6', JSON.stringify([]));
            renderView('questions');
        }
    }

    // --- Student Exam Taking Flow ---
    function startExam() {
        let qs = JSON.parse(localStorage.getItem('questions_v6')) || [];
        if(qs.length === 0) { alert('မေးခွန်း မရှိသေးပါ။ ဆရာ/မ ကို အကြောင်းကြားပါ။'); return; }
        
        let q = qs[0];
        document.getElementById('roleContent').innerHTML = `
            <div class="card-box" style="text-align:left;">
                <h3>Mathematics Exam (Google Form Style)</h3>
                <div style="background:rgba(0,0,0,0.2); padding:15px; border-radius:10px; margin-bottom:15px;">
                    <p><b>မေးခွန်း ၁။</b> ${escapeHtml(q.q)}</p>
                    <div style="margin-top:10px;">
                        <label style="display:block; margin-bottom:8px; cursor:pointer;"><input type="radio" name="studentAns" value="A"> A) ${escapeHtml(q.optA || '')}</label>
                        <label style="display:block; margin-bottom:8px; cursor:pointer;"><input type="radio" name="studentAns" value="B"> B) ${escapeHtml(q.optB || '')}</label>
                        <label style="display:block; margin-bottom:8px; cursor:pointer;"><input type="radio" name="studentAns" value="C"> C) ${escapeHtml(q.optC || '')}</label>
                        <label style="display:block; margin-bottom:8px; cursor:pointer;"><input type="radio" name="studentAns" value="D"> D) ${escapeHtml(q.optD || '')}</label>
                    </div>
                </div>
                <button onclick="submitExam()">အဖြေတင်သွင်းမည် (Submit Form)</button>
            </div>
        `;
    }

    function submitExam() {
        let selected = document.querySelector('input[name="studentAns"]:checked');
        if(!selected) { alert('ကျေးဇူးပြု၍ အဖြေတစ်ခု ရွေးချယ်ပါ။'); return; }

        let dateStr = new Date().toLocaleDateString();
        let results = JSON.parse(localStorage.getItem('results'));
        results.push({ student: currentUser.name, score: 50, total: 50, grade: 'A+', date: dateStr });
        localStorage.setItem('results', JSON.stringify(results));

        let slip = `CHINDWIN FUTURE BRIGHT SCHOOL
--------------------------------
EXAM RESULT SLIP (FORM SUBMITTED)
--------------------------------
Student : ${currentUser.name}
Subject : Mathematics
Score   : 50 / 50
Grade   : A+
Date    : ${dateStr}
--------------------------------
Thermal Printer Ready`;

        document.getElementById('roleContent').innerHTML = `
            <p style="color: #69F0AE; text-align: center; font-weight: bold; font-size:16px;">စာမေးပွဲ ဖြေဆိုပြီးစီးပါပြီ!</p>
            <div class="receipt">${slip}</div>
            <button onclick="window.print()" style="background-color: #69F0AE; color: #0A192F;">🖨️ 2-inch Thermal Printer ဖြင့် Print ထုတ်မည်</button>
            <button onclick="loadDashboard()" style="margin-top:10px;">ပင်မစာမျက်နှာသို့ ပြန်ရန်</button>
        `;
    }

    function logout() {
        currentUser = null;
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginMsg').innerText = '';
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }
</script>

</body>
</html>
