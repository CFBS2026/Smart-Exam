<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINDWIN FUTURE BRIGHT SCHOOL - Smart Exam System</title>

    <!-- Tesseract.js (OCR Library) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0A192F;
            --card-bg: #112240;
            --card-sub: #1D3557;
            --accent-color: #FFD700;
            --text-color: #FFFFFF;
            --text-muted: #8892B0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h2, h3, h4 {
            color: var(--accent-color);
            text-align: center;
            margin-top: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            background-color: #0A192F;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { opacity: 0.9; }
        .hidden { display: none; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .menu-card {
            background: var(--card-sub);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.2);
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .menu-card h4 {
            margin: 0 0 4px 0;
            color: #FFFFFF;
            font-size: 14px;
        }
        .menu-card p {
            margin: 0;
            font-size: 11px;
            color: var(--text-muted);
        }
        .section-title {
            color: var(--accent-color);
            font-size: 15px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            padding-bottom: 5px;
            margin: 20px 0 10px 0;
        }
        .card-box {
            background: var(--card-sub);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .ocr-box {
            border: 2px dashed var(--accent-color);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(255,215,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid rgba(255,215,0,0.3);
            padding: 8px;
            text-align: left;
        }
        th { color: var(--accent-color); }

        /* 2-inch Thermal Printer Receipt Styling */
        @media print {
            body * { visibility: hidden; }
            .printable-receipt, .printable-receipt * { visibility: visible; }
            .printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm;
                background: #fff;
                color: #000;
                font-family: monospace;
                padding: 5px;
            }
        }
        .receipt {
            background: #fff;
            color: #000;
            padding: 15px;
            font-family: monospace;
            border-radius: 8px;
            white-space: pre-wrap;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CHINDWIN FUTURE BRIGHT SCHOOL</h2>
    <div class="subtitle" id="portalSub">SMART EXAMINATION SYSTEM</div>

    <!-- 1. Login Section -->
    <div id="loginSection">
        <h3>အကောင့်ဝင်ရန် (Login)</h3>
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="principal / teacher / student">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="123">
        <button onclick="handleLogin()">ဝင်မည် (Login)</button>
        <p id="loginMsg" style="color: #ff6b6b; text-align: center;"></p>
    </div>

    <!-- 2. Dashboard Section -->
    <div id="dashboardSection" class="hidden">
        <h3 id="welcomeText" style="color: #69F0AE;"></h3>
        <div id="roleContent"></div>
        <button onclick="logout()" style="background-color: #ff6b6b; color: #fff; margin-top: 25px;">ထွက်ရန် (Logout)</button>
    </div>
</div>

<script>
    // Database Setup (LocalStorage)
    if (!localStorage.getItem('users')) {
        localStorage.setItem('users', JSON.stringify([
            {user: 'principal', pass: '123', role: 'principal', name: 'ကျောင်းအုပ်ကြီး (Principal)'},
            {user: 'teacher', pass: '123', role: 'teacher', name: 'ဦးဆောင်ဆရာမ (Teacher)'},
            {user: 'student', pass: '123', role: 'student', name: 'မောင်ကျောင်းသား (Student)'}
        ]));
    }
    if (!localStorage.getItem('students')) localStorage.setItem('students', JSON.stringify([{name: 'မောင်ကျောင်းသား', grade: 'Grade 12', roll: '1'}]));
    if (!localStorage.getItem('teachers')) localStorage.setItem('teachers', JSON.stringify([{name: 'ဦးဆောင်ဆရာမ', subject: 'Mathematics'}]));
    if (!localStorage.getItem('questions')) localStorage.setItem('questions', JSON.stringify([
        {q: 'Complex Number ၏ တန်ဖိုးကို ရှာပါ?', optA: '3 + 4i', optB: '1 - 2i', ans: 'A', sub: 'Mathematics'}
    ]));
    if (!localStorage.getItem('exams')) localStorage.setItem('exams', JSON.stringify([
        {title: 'Mathematics Monthly Exam', subject: 'Mathematics', marks: '50', duration: '60 mins'}
    ]));
    if (!localStorage.getItem('results')) localStorage.setItem('results', JSON.stringify([]));

    let currentUser = null;

    function handleLogin() {
        let u = document.getElementById('loginUser').value.trim();
        let p = document.getElementById('loginPass').value.trim();
        let users = JSON.parse(localStorage.getItem('users'));

        let found = users.find(x => x.user === u && x.pass === p);
        if (found) {
            currentUser = found;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('welcomeText').innerText = `မင်္ဂလာပါ၊ ${currentUser.name}`;
            loadDashboard();
        } else {
            document.getElementById('loginMsg').innerText = 'Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။';
        }
    }

    function loadDashboard() {
        let content = document.getElementById('roleContent');
        content.innerHTML = '';

        // --- 1. PRINCIPAL DASHBOARD ---
        if (currentUser.role === 'principal') {
            document.getElementById('portalSub').innerText = 'PRINCIPAL ADMINISTRATION';
            content.innerHTML = `
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('studentMgmt')"><h4>👥 Students</h4><p>ကျောင်းသား စာရင်း</p></div>
                    <div class="menu-card" onclick="renderView('teacherMgmt')"><h4>🎓 Teachers</h4><p>ဆရာ/ဆရာမ စာရင်း</p></div>
                    <div class="menu-card" onclick="renderView('exams')"><h4>📋 Examinations</h4><p>စာမေးပွဲများ</p></div>
                    <div class="menu-card" onclick="renderView('questions')"><h4>📖 Question Bank</h4><p>မေးခွန်းဘဏ် (OCR)</p></div>
                </div>
                <div class="section-title">Management Menu</div>
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('studentMgmt')"><h4>👤 Student Management</h4></div>
                    <div class="menu-card" onclick="renderView('teacherMgmt')"><h4>👨‍🏫 Teacher Management</h4></div>
                    <div class="menu-card" onclick="renderView('subjects')"><h4>📚 Class & Subjects</h4></div>
                    <div class="menu-card" onclick="renderView('questions')"><h4>📖 Question Bank (OCR)</h4></div>
                    <div class="menu-card" onclick="renderView('createExam')"><h4>✍️ Create Examination</h4></div>
                    <div class="menu-card" onclick="renderView('schedule')"><h4>📅 Exam Schedule</h4></div>
                    <div class="menu-card" onclick="renderView('reports')"><h4>📊 Results & Reports</h4></div>
                    <div class="menu-card" onclick="renderView('backup')"><h4>⚙️ Security & Backup</h4></div>
                </div>
                <div id="dynamicView"></div>
            `;
        } 
        // --- 2. TEACHER DASHBOARD ---
        else if (currentUser.role === 'teacher') {
            document.getElementById('portalSub').innerText = 'TEACHER EXAM PANEL';
            content.innerHTML = `
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('studentMgmt')"><h4>👥 Students</h4><p>ကျောင်းသား စစ်ဆေးချက်</p></div>
                    <div class="menu-card" onclick="renderView('questions')"><h4>📖 Question Bank</h4><p>မေးခွန်းဘဏ် (OCR)</p></div>
                    <div class="menu-card" onclick="renderView('createExam')"><h4>✍️ Create Exam</h4><p>စာမေးပွဲ ဖန်တီးရန်</p></div>
                    <div class="menu-card" onclick="renderView('reports')"><h4>📊 Exam Results</h4><p>စာမေးပွဲ ရလဒ်</p></div>
                    <div class="menu-card" onclick="renderView('subjects')"><h4>📚 Subjects & Chapters</h4><p>ဘာသာရပ်များ</p></div>
                    <div class="menu-card" onclick="renderView('schedule')"><h4>📅 Exam Schedule</h4><p>အချိန်ဇယား</p></div>
                </div>
                <div id="dynamicView"></div>
            `;
        } 
        // --- 3. STUDENT DASHBOARD ---
        else if (currentUser.role === 'student') {
            document.getElementById('portalSub').innerText = 'STUDENT EXAM PORTAL';
            content.innerHTML = `
                <div class="grid-2">
                    <div class="menu-card"><h4>🎓 အတန်း</h4><p>Grade 12</p></div>
                    <div class="menu-card"><h4>📚 ဘာသာရပ်</h4><p>Mathematics, English</p></div>
                </div>
                <div class="section-title">Available Exams (ဖြေဆိုရန် စာမေးပွဲများ)</div>
                <div class="card-box">
                    <h4 style="color:var(--accent-color); margin:0 0 5px 0;">Mathematics (Complex Number)</h4>
                    <p style="font-size:12px; color:var(--text-muted); margin:0 0 10px 0;">ချိန်ခွင်လျှာ: မိနစ် 60 | အမှတ်: 50</p>
                    <button onclick="startExam()">စာမေးပွဲ ဖြေဆိုမည်</button>
                </div>
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('myResults')"><h4>📊 My Results</h4><p>မိမိ ရလဒ်များ</p></div>
                    <div class="menu-card" onclick="alert('Student Profile: ' + currentUser.name)"><h4>👤 My Profile</h4><p>ကိုယ်ရေးအချက်အလက်</p></div>
                </div>
                <div id="dynamicView"></div>
            `;
        }
    }

    // --- Dynamic Views Engine ---
    function renderView(type) {
        let view = document.getElementById('dynamicView');
        if (type === 'questions') {
            let qs = JSON.parse(localStorage.getItem('questions'));
            let html = `
                <div class="card-box">
                    <h4>📖 Question Bank (OCR Photo Scan)</h4>
                    <div class="ocr-box">
                        <label><b>📷 မေးခွန်း ဓာတ်ပုံ တင်ရန် (OCR Scan)</b></label><br><br>
                        <input type="file" id="ocrImg" accept="image/*" onchange="processOCR()">
                        <p id="ocrStatus" style="font-size:12px; color:var(--accent-color); margin-top:8px;"></p>
                    </div>

                    <label>မေးခွန်း စာသား</label>
                    <textarea id="newQ" rows="3" placeholder="မေးခွန်း စာသား (ပုံမှ OCR ဖတ်ယူထားသော စာသားများ အလိုအလျောက် ပေါ်လာပါမည်)"></textarea>
                    
                    <input type="text" id="optA" placeholder="Option A">
                    <input type="text" id="optB" placeholder="Option B">
                    <input type="text" id="ansVal" placeholder="အမှန်ဖြေ (A သို့မဟုတ် B)">
                    
                    <button onclick="addQuestion()">မေးခွန်း သိမ်းဆည်းမည်</button>
                    
                    <h4 style="margin-top:20px;">ရှိပြီးသား မေးခွန်းများ</h4>
                    <ul>`;
            qs.forEach((q, i) => { html += `<li><b>${i+1}. ${q.q}</b><br>A) ${q.optA} | B) ${q.optB} [အမှန်: ${q.ans}]</li><br>`; });
            html += `</ul></div>`;
            view.innerHTML = html;
        } else if (type === 'createExam') {
            view.innerHTML = `<div class="card-box"><h4>✍️ စာမေးပွဲအသစ် ဖန်တီးရန်</h4>
                <input type="text" id="exTitle" placeholder="စာမေးပွဲခေါင်းစဉ်">
                <input type="text" id="exSub" placeholder="ဘာသာရပ်">
                <input type="text" id="exMarks" placeholder="စုစုပေါင်းရမှတ်">
                <button onclick="saveExam()">စာမေးပွဲ သိမ်းဆည်းမည်</button></div>`;
        } else if (type === 'reports' || type === 'myResults') {
            let res = JSON.parse(localStorage.getItem('results'));
            let html = `<div class="card-box"><h4>📊 စာမေးပွဲ ရလဒ်များ</h4>`;
            if (res.length === 0) { html += `<p>မှတ်တမ်း မရှိသေးပါ။</p>`; }
            else {
                html += `<table><tr><th>ကျောင်းသား</th><th>ဘာသာရပ်</th><th>ရမှတ်</th><th>ဂရိတ်</th></tr>`;
                res.forEach(r => {
                    if(currentUser.role === 'student' && r.student !== currentUser.name) return;
                    html += `<tr><td>${r.student}</td><td>${r.subject}</td><td>${r.score}/${r.total}</td><td>${r.grade}</td></tr>`;
                });
                html += `</table>`;
            }
            html += `</div>`;
            view.innerHTML = html;
        } else if (type === 'studentMgmt') {
            let sts = JSON.parse(localStorage.getItem('students'));
            view.innerHTML = `<div class="card-box"><h4>👤 ကျောင်းသား စီမံခန့်ခွဲမှု</h4>
                <input type="text" id="stName" placeholder="ကျောင်းသားအမည်">
                <input type="text" id="stGrade" placeholder="အတန်း (ဥပမာ - Grade 12)">
                <button onclick="addStudent()">ကျောင်းသား အသစ်ထည့်မည်</button>
                <ul>` + sts.map(s => `<li>${s.name} (${s.grade})</li>`).join('') + `</ul></div>`;
        } else if (type === 'teacherMgmt') {
            let tcs = JSON.parse(localStorage.getItem('teachers'));
            view.innerHTML = `<div class="card-box"><h4>👨‍🏫 ဆရာ/ဆရာမ စီမံခန့်ခွဲမှု</h4>
                <input type="text" id="tcName" placeholder="ဆရာမအမည်">
                <input type="text" id="tcSub" placeholder="သင်ကြားသည့် ဘာသာရပ်">
                <button onclick="addTeacher()">ဆရာမ အသစ်ထည့်မည်</button>
                <ul>` + tcs.map(t => `<li>${t.name} (${t.subject})</li>`).join('') + `</ul></div>`;
        } else if (type === 'backup') {
            view.innerHTML = `<div class="card-box"><h4>⚙️ Security & Data Backup</h4>
                <p style="font-size:12px; color:var(--text-muted);">ဒေတာများကို ဖိုင်ဖြင့် ထုတ်ယူသိမ်းဆည်းနိုင်ပါသည်။</p>
                <button onclick="exportData()">Export Database (JSON)</button></div>`;
        } else if (type === 'subjects') {
            view.innerHTML = `<div class="card-box"><h4>📚 Class & Subjects</h4><p>Grade 12: Myanmar, English, Mathematics, Chemistry, Physics, Biology</p></div>`;
        } else if (type === 'schedule') {
            view.innerHTML = `<div class="card-box"><h4>📅 Exam Schedule</h4><p>Mathematics Exam: 10:00 AM - 11:00 AM</p></div>`;
        } else if (type === 'exams') {
            let ex = JSON.parse(localStorage.getItem('exams'));
            view.innerHTML = `<div class="card-box"><h4>📋 စာမေးပွဲ စာရင်းများ</h4><ul>` + ex.map(e => `<li>${e.title} (${e.subject})</li>`).join('') + `</ul></div>`;
        }
    }

    // --- OCR Image Scanner Engine ---
    function processOCR() {
        let fileInput = document.getElementById('ocrImg');
        let status = document.getElementById('ocrStatus');
        let qArea = document.getElementById('newQ');

        if (fileInput.files.length === 0) return;

        let file = fileInput.files[0];
        status.innerText = '⏳ ပုံထဲမှ မေးခွန်း စာသားများကို OCR ဖတ်ယူနေပါသည်။ ခေတ္တစောင့်ပါ...';

        Tesseract.recognize(
            file,
            'eng',
            { logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဖတ်ယူနေမှု: ${Math.round(m.progress * 100)}%`; } }
        ).then(({ data: { text } }) => {
            status.innerText = '✅ OCR စာသား ဖတ်ယူခြင်း အောင်မြင်ပါသည်။';
            qArea.value = text.trim();
        }).catch(err => {
            status.innerText = '❌ စာသား ဖတ်ယူရာတွင် အမှားအယွင်း ရှိနေပါသည်။';
            console.error(err);
        });
    }

    // Database Actions
    function addQuestion() {
        let q = document.getElementById('newQ').value;
        let optA = document.getElementById('optA').value;
        let optB = document.getElementById('optB').value;
        let ans = document.getElementById('ansVal').value.toUpperCase();
        if(!q) { alert('မေးခွန်းဖြည့်ပါ။'); return; }
        let qs = JSON.parse(localStorage.getItem('questions'));
        qs.push({q, optA, optB, ans});
        localStorage.setItem('questions', JSON.stringify(qs));
        alert('မေးခွန်း အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။');
        renderView('questions');
    }

    function addStudent() {
        let name = document.getElementById('stName').value;
        let grade = document.getElementById('stGrade').value;
        if(!name) { alert('အမည်ဖြည့်ပါ။'); return; }
        let sts = JSON.parse(localStorage.getItem('students'));
        sts.push({name, grade});
        localStorage.setItem('students', JSON.stringify(sts));
        alert('ကျောင်းသား အောင်မြင်စွာ ထည့်ပြီးပါပြီ။');
        renderView('studentMgmt');
    }

    function addTeacher() {
        let name = document.getElementById('tcName').value;
        let subject = document.getElementById('tcSub').value;
        if(!name) { alert('အမည်ဖြည့်ပါ။'); return; }
        let tcs = JSON.parse(localStorage.getItem('teachers'));
        tcs.push({name, subject});
        localStorage.setItem('teachers', JSON.stringify(tcs));
        alert('ဆရာ/မ အောင်မြင်စွာ ထည့်ပြီးပါပြီ။');
        renderView('teacherMgmt');
    }

    function saveExam() {
        let title = document.getElementById('exTitle').value;
        let subject = document.getElementById('exSub').value;
        let marks = document.getElementById('exMarks').value;
        if(!title) { alert('ခေါင်းစဉ်ဖြည့်ပါ။'); return; }
        let exams = JSON.parse(localStorage.getItem('exams'));
        exams.push({title, subject, marks});
        localStorage.setItem('exams', JSON.stringify(exams));
        alert('စာမေးပွဲ ဖန်တီးပြီးပါပြီ။');
    }

    function exportData() {
        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
        let dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", "cfbs_exam_backup.json");
        dlAnchor.click();
    }

    // --- Student Exam Flow & 2-inch Bluetooth Thermal Printer Slip ---
    function startExam() {
        let qs = JSON.parse(localStorage.getItem('questions'));
        let q = qs[0] || {q: 'Complex Number ၏ တန်ဖိုးကို ရှာပါ?', optA: '3 + 4i', optB: '1 - 2i'};

        document.getElementById('roleContent').innerHTML = `
            <div class="card-box">
                <h3>Mathematics Exam (Grade 12)</h3>
                <p><b>မေးခွန်း။</b> ${q.q}</p>
                <label><input type="radio" name="ans" value="A"> A) ${q.optA}</label><br><br>
                <label><input type="radio" name="ans" value="B"> B) ${q.optB}</label><br><br>
                <button onclick="submitExam()">အဖြေတင်သွင်းမည် (Submit Exam)</button>
            </div>
        `;
    }

    function submitExam() {
        let score = 48;
        let total = 50;
        let dateStr = new Date().toLocaleDateString();

        let results = JSON.parse(localStorage.getItem('results'));
        results.push({ student: currentUser.name, subject: 'Mathematics', score: score, total: total, grade: 'A+', date: dateStr });
        localStorage.setItem('results', JSON.stringify(results));

        let slip = `CHINDWIN FUTURE BRIGHT SCHOOL
--------------------------------
EXAM RESULT SLIP
--------------------------------
Student : ${currentUser.name}
Subject : Mathematics (Grade 12)
Score   : ${score} / ${total}
Grade   : A+
Date    : ${dateStr}
--------------------------------
   Thermal Printer Ready`;

        document.getElementById('roleContent').innerHTML = `
            <p style="color: #69F0AE; text-align: center; font-weight: bold; font-size: 16px;">စာမေးပွဲ ဖြေဆိုပြီးစီးပါပြီ!</p>
            <div class="receipt printable-receipt">${slip}</div>
            <button onclick="window.print()" style="background-color: #69F0AE; color: #0A192F;">🖨️ 2-inch Thermal Printer ဖြင့် Print ထုတ်မည်</button>
            <button onclick="loadDashboard()" style="margin-top:10px;">ပင်မစာမျက်နှာသို့ ပြန်ရန်</button>
        `;
    }

    function logout() {
        currentUser = null;
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginMsg').innerText = '';
        document.getElementById('portalSub').innerText = 'SMART EXAMINATION SYSTEM';
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }
</script>

</body>
</html>
