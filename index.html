<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A192F">
<title>CFBS Smart Examination System</title>

<style>
:root{
 --navy:#0A192F;
 --card:#112240;
 --gold:#FFD700;
 --white:#F5F7FA;
 --muted:#A8B3CF;
 --green:#28C78B;
 --red:#E85D5D;
 --blue:#25466F;
}
*{box-sizing:border-box}
body{
 margin:0;padding:10px;background:var(--navy);
 color:var(--white);
 font-family:Arial,"Pyidaungsu","Noto Sans Myanmar",sans-serif
}
.container{
 max-width:950px;margin:auto;padding:15px;
 background:var(--card);border:1px solid #927B27;
 border-radius:14px;min-height:95vh
}
h2,h3{color:var(--gold)}
h2{text-align:center;font-size:21px}
.subtitle{text-align:center;color:var(--muted);font-size:12px}
.box{
 background:#1D3557;padding:13px;
 margin:12px 0;border-radius:9px;
 border:1px solid #425879
}
label{display:block;margin-top:12px;font-size:14px}
input,select,textarea{
 width:100%;padding:11px;margin-top:5px;
 background:var(--navy);color:white;
 border:1px solid var(--gold);
 border-radius:7px;font-size:14px
}
textarea{min-height:85px}
button{
 width:100%;padding:12px;margin-top:9px;
 background:var(--gold);color:var(--navy);
 border:0;border-radius:7px;font-weight:bold;
 cursor:pointer
}
button.secondary{background:#526581;color:white}
button.danger{background:var(--red);color:white}
button.green{background:var(--green);color:#082b1e}
button:disabled{opacity:.4}
.hidden{display:none!important}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:9px;margin:12px 0
}
.menu{
 background:#25466F;padding:15px;
 border-radius:9px;border:1px solid #617797;
 cursor:pointer
}
.menu b{display:block;color:white}
.menu small{color:#c6d3e6}
.notice{
 background:#0A3150;padding:11px;
 border-radius:8px;color:#dceaff;
 font-size:12px;line-height:1.7
}
.muted{color:var(--muted);font-size:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px;border:1px solid #526581;text-align:left}
th{color:var(--gold)}
.option{
 display:flex;gap:10px;align-items:center;
 background:#112240;padding:10px;
 border-radius:7px;margin:7px 0
}
.option input{width:auto;margin:0}
.option label{margin:0}
.timer{
 background:var(--gold);color:var(--navy);
 font-size:22px;font-weight:bold;
 text-align:center;padding:12px;
 border-radius:8px;position:sticky;top:0
}
.question{padding:13px;background:#25466F;margin:12px 0;border-radius:8px}
.smallbtn{width:auto;padding:6px 9px;font-size:11px}
.inline{display:flex;align-items:center;gap:8px}
.inline input{width:auto}
@media(max-width:500px){
 .container{padding:9px}
 .grid{gap:6px}
 .menu{padding:11px}
}
</style>
</head>

<body>
<div class="container">

<h2>👑 CHINDWIN FUTURE BRIGHT SCHOOL</h2>
<div class="subtitle" id="portalSub">
SMART EXAMINATION SYSTEM
</div>

<!-- LOGIN -->
<section id="loginSection">
<div class="box">
<h3 style="text-align:center">အကောင့်ဝင်ရန်</h3>

<label>Username</label>
<input id="loginUser" autocomplete="username">

<label>Password</label>
<input id="loginPass" type="password" autocomplete="current-password">

<button onclick="handleLogin()">အကောင့်ဝင်မည်</button>

<p id="loginMsg" style="color:#ff7777;text-align:center"></p>

<div class="notice">
စမ်းသပ်အကောင့်များ<br>
ကျောင်းအုပ် — principal / 123<br>
ဆရာ — teacher / 123<br>
ကျောင်းသား — student / 123
</div>
</div>
</section>

<!-- DASHBOARD -->
<section id="dashboardSection" class="hidden">
<h3 id="welcomeText" style="text-align:center"></h3>
<div id="roleContent"></div>
<button class="danger" onclick="logout()">Logout</button>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
'use strict';

/* ================= DATA ================= */

const KEY={
 users:'cfbs_users_v10',
 questions:'cfbs_questions_v10',
 exams:'cfbs_exams_v10',
 attempts:'cfbs_attempts_v10',
 results:'cfbs_results_v10'
};

const GRADES=[
 'KG','Grade 1','Grade 2','Grade 3','Grade 4',
 'Grade 5','Grade 6','Grade 7','Grade 8','Grade 9',
 'Grade 10','Grade 11','Grade 12'
];

const EXAMS=[
 'ပထမလပတ်',
 'ဒုတိယလပတ်',
 'တတိယလပတ်',
 'စတုတ္ထလပတ်',
 'အတန်းတင်စာမေးပွဲ'
];

const COMBINATIONS={
 'Combination 1':[
 'မြန်မာစာ','အင်္ဂလိပ်စာ','သင်္ချာ',
 'ဓာတုဗေဒ','ရူပဗေဒ','ဇီဝဗေဒ'
 ],
 'Combination 2':[
 'မြန်မာစာ','အင်္ဂလိပ်စာ','သင်္ချာ',
 'ဓာတုဗေဒ','ရူပဗေဒ','ဘောဂဗေဒ'
 ],
 'Combination 3':[
 'မြန်မာစာ','အင်္ဂလိပ်စာ','သင်္ချာ',
 'ပထဝီဝင်','သမိုင်း','ဘောဂဗေဒ'
 ]
};

const LOWER=[
 'မြန်မာစာ','အင်္ဂလိပ်စာ','သင်္ချာ',
 'လူမှုရေး','သိပ္ပံ'
];

const MIDDLE=[
 'မြန်မာစာ','အင်္ဂလိပ်စာ','သင်္ချာ',
 'ပထဝီဝင်','သမိုင်း','သိပ္ပံ'
];

function $(id){return document.getElementById(id)}

function read(key){
 try{return JSON.parse(localStorage.getItem(key))||[]}
 catch(e){return []}
}

function save(key,data){
 localStorage.setItem(key,JSON.stringify(data));
}

function id(prefix){
 return prefix+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
}

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 })[c]);
}

function upper(g){
 return ['Grade 10','Grade 11','Grade 12'].includes(g);
}

function subjects(g,combo){
 if(['KG','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5'].includes(g))
 return LOWER;

 if(['Grade 6','Grade 7','Grade 8','Grade 9'].includes(g))
 return MIDDLE;

 if(upper(g))return COMBINATIONS[combo]||[];

 return [];
}

function gradeOptions(selected=''){
 return GRADES.map(g=>
 `<option value="${g}" ${g===selected?'selected':''}>${g}</option>`
 ).join('');
}

function comboOptions(selected='Combination 1'){
 return Object.keys(COMBINATIONS).map(c=>
 `<option value="${c}" ${c===selected?'selected':''}>${c}</option>`
 ).join('');
}

function newId(){return id('CFBS')}

/* ================= INITIAL DATA ================= */

function initialize(){

 if(!localStorage.getItem(KEY.users)){
  save(KEY.users,[
   {
    id:newId(),user:'principal',pass:'123',
    role:'principal',name:'ကျောင်းအုပ်ကြီး'
   },
   {
    id:newId(),user:'teacher',pass:'123',
    role:'teacher',name:'စမ်းသပ်ဆရာ',
    grade:'Grade 6',subject:'သင်္ချာ'
   },
   {
    id:newId(),user:'student',pass:'123',
    role:'student',name:'မောင်ကျောင်းသား',
    roll:'00001',grade:'Grade 6',
    combo:'-',status:'active'
   }
  ]);
 }

 [KEY.questions,KEY.exams,KEY.attempts,KEY.results]
 .forEach(k=>{
  if(!localStorage.getItem(k))save(k,[]);
 });
}

initialize();

let currentUser=null;
let activeExam=null;
let timer=null;

/* ================= LOGIN ================= */

function handleLogin(){

 const username=$('loginUser').value.trim();
 const password=$('loginPass').value;

 const user=read(KEY.users).find(u=>
  u.user===username&&u.pass===password
 );

 if(!user){
  $('loginMsg').textContent='Username သို့မဟုတ် Password မှားနေပါသည်။';
  return;
 }

 if(user.status==='inactive'){
  $('loginMsg').textContent='ဤအကောင့်ကို ပိတ်ထားပါသည်။';
  return;
 }

 currentUser=user;

 $('loginSection').classList.add('hidden');
 $('dashboardSection').classList.remove('hidden');

 $('welcomeText').textContent=
 `မင်္ဂလာပါ ${user.name}`;

 dashboard();
}

function logout(){

 if(timer){
  alert('စာမေးပွဲဖြေနေစဉ် Logout မလုပ်နိုင်ပါ။');
  return;
 }

 currentUser=null;

 $('dashboardSection').classList.add('hidden');
 $('loginSection').classList.remove('hidden');

 $('loginUser').value='';
 $('loginPass').value='';
 $('portalSub').textContent='SMART EXAMINATION SYSTEM';
}

/* ================= ROLE DASHBOARD ================= */

function menu(icon,title,fn){
 return `<div class="menu" onclick="${fn}">
 <b>${icon} ${title}</b>
 <small>ဖွင့်ရန်နှိပ်ပါ</small>
 </div>`;
}

function dashboard(){

 const root=$('roleContent');

 if(currentUser.role==='principal'){

  $('portalSub').textContent='PRINCIPAL ACCOUNT MANAGEMENT';

  root.innerHTML=`
   <div class="notice">
   ကျောင်းအုပ်၏ လုပ်ပိုင်ခွင့်မှာ ဆရာ/ဆရာမနှင့်
   ကျောင်းသားအကောင့်ဖန်တီးခြင်းသာ ဖြစ်ပါသည်။
   Question Bank နှင့် စာမေးပွဲဖန်တီးခြင်း မပါဝင်ပါ။
   </div>

   <div class="grid">
    ${menu('👨‍🏫','ဆရာ/ဆရာမ အကောင့်ဖန်တီးရန်',"showTeachers()")}
    ${menu('🎓','ကျောင်းသား အကောင့်ဖန်တီးရန်',"showStudents()")}
   </div>

   <div id="dynamicView"></div>
  `;

 }else if(currentUser.role==='teacher'){

  $('portalSub').textContent='TEACHER PORTAL';

  root.innerHTML=`
   <div class="notice">
   ဆရာ/ဆရာမသည် Question Bank၊ OCR၊
   စာမေးပွဲဖန်တီးခြင်းနှင့် Question File Export/Import
   ကို ဆောင်ရွက်နိုင်ပါသည်။
   </div>

   <div class="grid">
    ${menu('📚','Question Bank',"showQuestionBank()")}
    ${menu('📥','Question File Import',"showTeacherImport()")}
    ${menu('📝','စာမေးပွဲဖန်တီးရန်',"showCreateExam()")}
    ${menu('📋','စာမေးပွဲစာရင်း',"showExamList()")}
    ${menu('📤','Question File Export',"showExport()")}
    ${menu('📊','ရလဒ်များ',"showTeacherResults()")}
   </div>

   <div id="dynamicView"></div>
  `;

 }else{

  $('portalSub').textContent='STUDENT EXAMINATION PORTAL';
  studentDashboard();
 }
}

/* ================= PRINCIPAL ACCOUNT MANAGEMENT ================= */

function showTeachers(){

 if(currentUser.role!=='principal')return;

 const view=$('dynamicView');

 view.innerHTML=`
 <div class="box">
 <h3>ဆရာ/ဆရာမ အကောင့်ဖန်တီးရန်</h3>

 <label>အမည်</label>
 <input id="tName">

 <label>Username</label>
 <input id="tUser">

 <label>Password</label>
 <input id="tPass">

 <label>တာဝန်အတန်း</label>
 <select id="tGrade" onchange="teacherSubjectOptions()">
 ${gradeOptions('Grade 6')}
 </select>

 <div id="tComboWrap" class="hidden">
 <label>ဘာသာတွဲ</label>
 <select id="tCombo" onchange="teacherSubjectOptions()">
 ${comboOptions()}
 </select>
 </div>

 <label>တာဝန်ဘာသာရပ်</label>
 <select id="tSubject"></select>

 <button onclick="createTeacher()">အကောင့်ဖန်တီးမည်</button>
 </div>

 <div class="box">
 <h3>ဆရာ/ဆရာမစာရင်း</h3>
 <div id="teacherTable"></div>
 </div>
 `;

 teacherSubjectOptions();
 drawTeachers();
}

function teacherSubjectOptions(){

 const g=$('tGrade').value;
 const combo=$('tCombo').value;

 $('tComboWrap').classList.toggle('hidden',!upper(g));

 $('tSubject').innerHTML=
 subjects(g,combo).map(s=>
 `<option>${esc(s)}</option>`
 ).join('');
}

function createTeacher(){

 const name=$('tName').value.trim();
 const user=$('tUser').value.trim();
 const pass=$('tPass').value;
 const grade=$('tGrade').value;
 const combo=upper(grade)?$('tCombo').value:'-';
 const subject=$('tSubject').value;

 if(!name||!user||!pass)return alert('အချက်အလက်ဖြည့်ပါ။');

 const users=read(KEY.users);

 if(users.some(u=>u.user.toLowerCase()===user.toLowerCase()))
 return alert('Username ရှိပြီးသားဖြစ်သည်။');

 users.push({
  id:newId(),name,user,pass,
  role:'teacher',grade,combo,subject,
  status:'active'
 });

 save(KEY.users,users);

 alert('ဆရာ/ဆရာမအကောင့် ဖန်တီးပြီးပါပြီ။');
 showTeachers();
}

function drawTeachers(){

 const list=read(KEY.users).filter(u=>u.role==='teacher');

 $('teacherTable').innerHTML=`
 <div class="table-wrap"><table>
 <tr><th>စဉ်</th><th>အမည်</th><th>Username</th><th>အတန်း</th><th>ဘာသာ</th><th>Password</th><th></th></tr>
 ${list.map((u,i)=>`
 <tr>
 <td>${i+1}</td><td>${esc(u.name)}</td>
 <td>${esc(u.user)}</td><td>${esc(u.grade)}</td>
 <td>${esc(u.subject)}</td><td>${esc(u.pass)}</td>
 <td><button class="danger smallbtn" onclick="deleteUser('${u.id}')">ဖျက်</button></td>
 </tr>`).join('')}
 </table></div>`;
}

function showStudents(){

 if(currentUser.role!=='principal')return;

 $('dynamicView').innerHTML=`
 <div class="box">
 <h3>ကျောင်းသားအကောင့်ဖန်တီးရန်</h3>

 <label>ကျောင်းသားအမည်</label>
 <input id="sName">

 <label>Student ID / ကျောင်းဝင်အမှတ်</label>
 <input id="sRoll">

 <label>အဖအမည်</label>
 <input id="sFather">

 <label>အတန်း</label>
 <select id="sGrade" onchange="studentComboToggle()">
 ${gradeOptions('KG')}
 </select>

 <div id="sComboWrap" class="hidden">
 <label>ဘာသာတွဲ</label>
 <select id="sCombo">${comboOptions()}</select>
 </div>

 <label>Username</label>
 <input id="sUser">

 <label>Password</label>
 <input id="sPass">

 <button onclick="createStudent()">ကျောင်းသားအကောင့်ဖန်တီးမည်</button>
 </div>

 <div class="box">
 <h3>အတန်းအလိုက် ကျောင်းသားစာရင်း</h3>
 <label>အတန်းရွေးပါ</label>
 <select id="sFilter" onchange="drawStudents()">${gradeOptions('KG')}</select>
 <label>ရှာရန်</label>
 <input id="sSearch" oninput="drawStudents()">
 <div id="studentTable"></div>
 </div>
 `;

 studentComboToggle();
 drawStudents();
}

function studentComboToggle(){
 $('sComboWrap').classList.toggle('hidden',!upper($('sGrade').value));
}

function createStudent(){

 const name=$('sName').value.trim();
 const roll=$('sRoll').value.trim();
 const father=$('sFather').value.trim();
 const grade=$('sGrade').value;
 const combo=upper(grade)?$('sCombo').value:'-';
 const user=$('sUser').value.trim();
 const pass=$('sPass').value;

 if(!name||!roll||!user||!pass)
 return alert('အချက်အလက်အားလုံး ဖြည့်ပါ။');

 const users=read(KEY.users);

 if(users.some(u=>u.user.toLowerCase()===user.toLowerCase()))
 return alert('Username ရှိပြီးသားဖြစ်သည်။');

 if(users.some(u=>u.role==='student'&&u.roll===roll))
 return alert('Student ID ရှိပြီးသားဖြစ်သည်။');

 users.push({
  id:newId(),name,roll,father,grade,combo,
  user,pass,role:'student',status:'active'
 });

 save(KEY.users,users);

 alert('ကျောင်းသားအကောင့် ဖန်တီးပြီးပါပြီ။');
 showStudents();
}

function drawStudents(){

 const grade=$('sFilter').value;
 const q=$('sSearch').value.toLowerCase();

 const list=read(KEY.users).filter(u=>
  u.role==='student'&&u.grade===grade&&
  (u.name+' '+u.roll+' '+u.user).toLowerCase().includes(q)
 );

 $('studentTable').innerHTML=`
 <p class="muted">${esc(grade)} — ${list.length} ဦး</p>
 <div class="table-wrap"><table>
 <tr><th>စဉ်</th><th>ID</th><th>အမည်</th><th>Username</th><th>Password</th><th>ဘာသာတွဲ</th><th></th></tr>
 ${list.map((u,i)=>`
 <tr>
 <td>${i+1}</td><td>${esc(u.roll)}</td>
 <td>${esc(u.name)}</td><td>${esc(u.user)}</td>
 <td>${esc(u.pass)}</td><td>${esc(u.combo)}</td>
 <td><button class="danger smallbtn" onclick="deleteUser('${u.id}')">ဖျက်</button></td>
 </tr>`).join('')}
 </table></div>`;
}

function deleteUser(uid){

 if(currentUser.role!=='principal')return;

 if(!confirm('ဤအကောင့်ကို ဖျက်မှာ သေချာပါသလား။'))return;

 save(KEY.users,read(KEY.users).filter(u=>u.id!==uid));

 if($('teacherTable'))drawTeachers();
 if($('studentTable'))drawStudents();
}

/* ================= TEACHER QUESTION BANK ================= */

function showQuestionBank(){

 if(currentUser.role!=='teacher')return;

 $('dynamicView').innerHTML=`
 <div class="box">
 <h3>Question Bank</h3>
 <input type="hidden" id="editQId" value="">

 <label>အတန်း</label>
 <select id="qGrade" onchange="updateQSubjects()">
 ${gradeOptions(currentUser.grade)}
 </select>

 <div id="qComboWrap" class="hidden">
 <label>ဘာသာတွဲ</label>
 <select id="qCombo" onchange="updateQSubjects()">
 ${comboOptions(currentUser.combo||'Combination 1')}
 </select>
 </div>

 <label>ဘာသာရပ်</label>
 <select id="qSubject"></select>

 <label>Chapter</label>
 <input id="qChapter">

 <label>မေးခွန်းအမျိုးအစား</label>
 <select id="qType" onchange="qTypeChange()">
 <option value="mcq">Multiple Choice</option>
 <option value="tf">True / False</option>
 <option value="fill">Fill in the Blank</option>
 <option value="short">Short Answer</option>
 <option value="essay">Essay / Written</option>
 </select>

 <label>မေးခွန်း</label>
 <textarea id="qText"></textarea>

 <label>မေးခွန်းပုံ (OCR)</label>
 <input type="file" id="qImage" accept="image/*">
 <button class="secondary" onclick="runOCR()">OCR ဖြင့်စာဖတ်ရန်</button>
 <p id="ocrStatus" class="muted"></p>

 <div id="mcqFields">
 <label>Option A</label><input id="qA">
 <label>Option B</label><input id="qB">
 <label>Option C</label><input id="qC">
 <label>Option D</label><input id="qD">
 <label>အဖြေမှန်</label>
 <select id="qAnswer"><option>A</option><option>B</option><option>C</option><option>D</option></select>
 </div>

 <div id="textAnswerFields" class="hidden">
 <label>အဖြေမှန်</label>
 <input id="qTextAnswer">
 </div>

 <label>အမှတ်</label>
 <input id="qMark" type="number" min="1" value="1">

 <button onclick="saveQuestion()" id="saveQBtn">မေးခွန်းသိမ်းမည်</button>
 <button class="secondary hidden" id="cancelEditBtn" onclick="cancelEditQuestion()">ပြင်ဆင်ခြင်းရပ်ဆဲမည်</button>
 </div>

 <div class="box">

async function runOCR(){

 const file=$('qImage').files[0];

 if(!file)return alert('မေးခွန်းပုံရွေးပါ။');

 if(!window.Tesseract)
 return alert('OCR အတွက် Internet ချိတ်ဆက်ထားပါ။');

 $('ocrStatus').textContent='စာဖတ်နေပါသည်...';

 try{

  const result=await Tesseract.recognize(
   file,'mya+eng',
   {logger:m=>{
    if(m.status)$('ocrStatus').textContent=
    m.status+' '+Math.round((m.progress||0)*100)+'%';
   }}
  );

  let rawText = result.data.text;
  let formattedText = rawText.split('\n')
                           .map(line => line.trim())
                           .filter(line => line.length > 0)
                           .join('\n\n');

  $('qText').value=(
   $('qText').value+'\n'+formattedText
  ).trim();

  $('ocrStatus').textContent=
  'ဖတ်ပြီးပါပြီ။ စာသားကို စစ်ဆေးပြီး သိမ်းပါ။';

 }catch(e){

  $('ocrStatus').textContent='OCR မအောင်မြင်ပါ။';

 }
}

function saveQuestion(){

 const editId=$('editQId').value;
 const grade=$('qGrade').value;
 const combo=upper(grade)?$('qCombo').value:'-';
 const subject=$('qSubject').value;
 const chapter=$('qChapter').value.trim();
 const text=$('qText').value.trim();
 const type=$('qType').value;
 const mark=Number($('qMark').value);

 if(!chapter||!text||!subject||!Number.isInteger(mark)||mark<=0)
 return alert('မေးခွန်းအချက်အလက် ပြည့်စုံစွာဖြည့်ပါ။');

 if(currentUser.grade&&currentUser.grade!=='အားလုံး'&&grade!==currentUser.grade)
 return alert('သတ်မှတ်ထားသောအတန်းသာ ထည့်နိုင်ပါသည်။');

 if(currentUser.subject&&currentUser.subject!=='အားလုံး'&&subject!==currentUser.subject)
 return alert('သတ်မှတ်ထားသောဘာသာရပ်သာ ထည့်နိုင်ပါသည်။');

 const q={
  id:editId?editId:newId(),grade,combo,subject,chapter,text,type,mark,
  owner:currentUser.user
 };

 if(type==='mcq'){

  q.options=[
   $('qA').value.trim(),
   $('qB').value.trim(),
   $('qC').value.trim(),
   $('qD').value.trim()
  ];

  q.answer=$('qAnswer').value;

  if(q.options.some(x=>!x))
  return alert('A/B/C/D အားလုံးဖြည့်ပါ။');

  q.answer=$('qTextAnswer').value.trim();

  if(!q.answer)return alert('အဖြေမှန်ဖြည့်ပါ။');

 const bank=read(KEY.questions);
 
 if(editId){
  const idx=bank.findIndex(x=>x.id===editId);
  if(idx>-1) bank[idx]=q;
 }else{
  bank.push(q);
 }

 save(KEY.questions,bank);

 alert('Question Bank သိမ်းပြီးပါပြီ။');
 showQuestionBank();
}

function exactMarkSelection(pool,count,total){

 const a=[...pool].sort(()=>Math.random()-.5);
 const memo=new Set();

 function find(i,n,sum,chosen){

  if(n===0)return sum===total?chosen:null;

  if(i>=a.length||a.length-i<n||sum>total)return null;

  const key=i+'-'+n+'-'+sum;

  if(memo.has(key))return null;

  memo.add(key);

  const first=find(i+1,n-1,sum+a[i].mark,[...chosen,a[i]]);

  if(first)return first;

  return find(i+1,n,sum,chosen);
 }

 return find(0,count,0,[]);
}

function startExam(eid){

 const exam=read(KEY.exams).find(e=>e.id===eid);

 if(!exam)return;

 const attempts=read(KEY.attempts);

 const old=attempts.find(a=>
 a.examId===eid&&a.student===currentUser.user
 );

 if(old&&old.status==='completed')
 return alert('ဤစာမေးပွဲကို ဖြေဆိုပြီးပါပြီ။');

 if(old&&old.status==='started'){

  activeExam={
   exam,
   questions:old.questions,
   answers:old.answers||{},
   start:old.start
  };

 }else{

  activeExam={
   exam,
   questions:[...exam.questions].sort(()=>Math.random()-.5),
   answers:{},
   start:Date.now()
  };

  attempts.push({
   examId:eid,
   student:currentUser.user,
   status:'started',
   start:activeExam.start,
   questions:activeExam.questions,
   answers:{}
  });

  save(KEY.attempts,attempts);
 }

 renderQuiz();
}

   controls=q.options.map((op,j)=>`
   <div class="option">
   <input type="radio" name="ans${i}" value="${'ABCD'[j]}"
   ${val==='ABCD'[j]?'checked':''}
   onchange="setAnswer('${q.id}',this.value)">
   <label>${'ABCD'[j]}. ${esc(op)}</label>
   </div>`).join('');

  }else if(q.type==='tf'){

   controls=['မှန်','မှား'].map(op=>`
   <div class="option">
   <input type="radio" name="ans${i}" value="${op}"
   ${val===op?'checked':''}
   onchange="setAnswer('${q.id}',this.value)">
   <label>${op}</label>
   </div>`).join('');

  }else{

   controls=`
   <textarea placeholder="အဖြေရေးပါ"
   oninput="setAnswer('${q.id}',this.value)">${esc(val)}</textarea>
   `;

  }

  return `
  <div class="question" id="q_${q.id}">
  <b>မေးခွန်း ${i+1} (${q.mark} မှတ်)</b>
  <p>${esc(q.text)}</p>
  ${controls}
  </div>`;

 }).join('');

 startTimer();
}

function setAnswer(qid,value){

 activeExam.answers[qid]=value;
 persistAttempt();
}

function startTimer(){

 clearInterval(timer);

 const end=activeExam.start+
 activeExam.exam.minutes*60000;

 function tick(){

  const left=Math.max(0,Math.ceil((end-Date.now())/1000));

  if($('timer')){
   $('timer').textContent=
   String(Math.floor(left/60)).padStart(2,'0')+
   ':'+
   String(left%60).padStart(2,'0');
  }

  if(left<=0){
   clearInterval(timer);
   timer=null;
   submitExam(true);
  }
 }

 tick();
 timer=setInterval(tick,1000);
}

function reviewQuiz(){

 clearInterval(timer);
 timer=null;

 $('roleContent').innerHTML=`
 <div class="box">
 <h3>အဖြေပြန်စစ်ရန်</h3>
 <p class="muted">အစိမ်း = ဖြေပြီး / အနီ = မဖြေရသေး</p>
 <div class="grid">
 ${activeExam.questions.map((q,i)=>`
 <button class="${activeExam.answers[q.id]?'green':'danger'}"
 onclick="backToQuestion('${q.id}')">
 မေးခွန်း ${i+1}
 </button>`).join('')}
 </div>
 <button class="green" onclick="submitExam(false)">Submit အပြီးသတ်မည်</button>
 <button class="secondary" onclick="renderQuiz()">ဆက်ဖြေမည်</button>
 </div>`;
}

function backToQuestion(qid){

 renderQuiz();

 setTimeout(()=>{
  $('q_'+qid)?.scrollIntoView({behavior:'smooth'});
 },100);
}

/* ================= SUBMIT AND RESULT ================= */

function submitExam(auto){

 if(!activeExam)return;

 if(!auto&&!confirm('အဖြေများကို အပြီးသတ် Submit လုပ်မှာ သေချာပါသလား။'))
 return;

 clearInterval(timer);
 timer=null;

 const exam=activeExam.exam;
 const questions=activeExam.questions;

 let score=0;
 let manualPending=0;

 questions.forEach(q=>{

  if(q.type==='essay'){
   manualPending+=Number(q.mark);
   return;
  }

  const given=String(activeExam.answers[q.id]||'')
  .trim().toLowerCase();

  const correct=String(q.answer||'')
  .trim().toLowerCase();

  if(given&&given===correct){
   score+=Number(q.mark);
  }

 });

 const finish=Date.now();
 const duration=Math.max(0,Math.round(
  (finish-activeExam.start)/60000
 ));

 const percent=exam.total?
 score/exam.total*100:0;

 const grade=
 percent>=80?'A':
 percent>=60?'B':
 percent>=40?'C':'D';

 const result={
  id:newId(),
  username:currentUser.user,
  student:currentUser.name,
  roll:currentUser.roll,
  gradeName:currentUser.grade,
  combo:currentUser.combo,
  title:exam.title,
  examType:exam.type,
  subject:exam.subject,
  start:new Date(activeExam.start).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
  end:new Date(finish).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
  duration,
  score,
  total:exam.total,
  percent:Math.round(percent*100)/100,
  grade,
  manualPending
 };

 save(KEY.results,[...read(KEY.results),result]);

 const attempts=read(KEY.attempts);

 const attempt=attempts.find(a=>
 a.examId===exam.id&&
 a.student===currentUser.user
 );

 if(attempt){
  attempt.status='completed';
  attempt.end=finish;
  attempt.answers=activeExam.answers;
 }

 save(KEY.attempts,attempts);

 activeExam=null;

 showResult(result);
}

function showResult(r){

 $('roleContent').innerHTML=`
 <div class="box" id="printArea">

 <h3 style="text-align:center">
 CHINDWIN FUTURE BRIGHT SCHOOL
 </h3>

 <h3 style="text-align:center">EXAM RESULT</h3>

 <p>Student Name: ${esc(r.student)}</p>
 <p>Student ID: ${esc(r.roll)}</p>
 <p>Class: ${esc(r.gradeName)}</p>
 <p>Examination: ${esc(r.title)}</p>
 <p>Subject: ${esc(r.subject)}</p>

 <div class="table-wrap">
 <table>
 <tr><th>Information</th><th>Result</th></tr>
 <tr><td>Start Time</td><td>${esc(r.start)}</td></tr>
 <tr><td>Finish Time</td><td>${esc(r.end)}</td></tr>
 <tr><td>Duration</td><td>${r.duration} Minutes</td></tr>
 <tr>
 <td>Score</td>
 <td>${r.score} / ${r.total}</td>
 </tr>
 <tr>
 <td>Grade</td>
 <td>${r.manualPending?'Pending (Manual check required)':r.grade}</td>
 </tr>
 </table>
 </div>

 <p>Principal Signature: __________________</p>

 </div>

 <button onclick="window.print()">ရလဒ် Print ထုတ်ရန်</button>
 <button class="secondary" onclick="dashboard()">ပင်မစာမျက်နှာ</button>
 `;

}

/* ================= RESULTS ================= */

 r.username===currentUser.user
 );

 $('myResults').innerHTML=`

 <tr><th>စာမေးပွဲ</th><th>ဘာသာ</th><th>ရမှတ်</th><th>Grade</th></tr>
