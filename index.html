<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINDWIN FUTURE BRIGHT SCHOOL - Smart Exam System</title>

    <!-- Tesseract.js (OCR Library) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0A192F;
            --card-bg: #112240;
            --card-sub: #1D3557;
            --accent-color: #FFD700;
            --text-color: #FFFFFF;
            --text-muted: #8892B0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h2, h3, h4 {
            color: var(--accent-color);
            text-align: center;
            margin-top: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            background-color: #0A192F;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { opacity: 0.9; }
        .hidden { display: none !important; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .menu-card {
            background: var(--card-sub);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.2);
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .card-box {
            background: var(--card-sub);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .ocr-box {
            border: 2px dashed var(--accent-color);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(255,215,0,0.05);
        }
        .q-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--accent-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .option-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            display: flex;
            align-items: center;
        }
        .option-item input[type="radio"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }
        .option-item label { cursor: pointer; width: 100%; }
        .receipt {
            background: #fff;
            color: #000;
            padding: 15px;
            font-family: monospace;
            border-radius: 8px;
            white-space: pre-wrap;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CHINDWIN FUTURE BRIGHT SCHOOL</h2>
    <div class="subtitle" id="portalSub">SMART EXAMINATION SYSTEM</div>

    <!-- 1. Login Section -->
    <div id="loginSection">
        <h3>အကောင့်ဝင်ရန် (Login)</h3>
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="principal / teacher / student">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="123">
        <button onclick="handleLogin()">ဝင်မည် (Login)</button>
        <p id="loginMsg" style="color: #ff6b6b; text-align: center;"></p>
    </div>

    <!-- 2. Dashboard Section -->
    <div id="dashboardSection" class="hidden">
        <h3 id="welcomeText" style="color: #69F0AE;"></h3>
        <div id="roleContent"></div>
        <button onclick="logout()" style="background-color: #ff6b6b; color: #fff; margin-top: 25px;">ထွက်ရန် (Logout)</button>
    </div>
</div>

<script>
    // System Database Initialization
    if (!localStorage.getItem('users')) {
        localStorage.setItem('users', JSON.stringify([
            {user: 'principal', pass: '123', role: 'principal', name: 'ကျောင်းအုပ်ကြီး'},
            {user: 'teacher', pass: '123', role: 'teacher', name: 'ဆရာမကြီး'},
            {user: 'student', pass: '123', role: 'student', name: 'မောင်ကျောင်းသား', subject: 'Mathematics'}
        ]));
    }
    if (!localStorage.getItem('questions_v12')) {
        localStorage.setItem('questions_v12', JSON.stringify([
            {id: 1, sub: 'Mathematics', q: 'If z1 = 6-17i, z2 = 3-bi and z1/z2 = 4-3i, then b is', optA: '1', optB: '2', optC: '3', optD: '4', ans: 'A'},
            {id: 2, sub: 'Mathematics', q: 'The equation of the sphere is x^2 + y^2 + z^2 + 6x - 2y + 2z - 5 = 0. Then the radius is?', optA: '3', optB: '4', optC: '5', optD: '6', ans: 'B'}
        ]));
    }
    if (!localStorage.getItem('results')) localStorage.setItem('results', JSON.stringify([]));

    let currentUser = null;
    let studentAnswers = {};

    function handleLogin() {
        let u = document.getElementById('loginUser').value.trim();
        let p = document.getElementById('loginPass').value.trim();
        let users = JSON.parse(localStorage.getItem('users'));

        let found = users.find(x => x.user === u && x.pass === p);
        if (found) {
            currentUser = found;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('welcomeText',).innerText = `မင်္ဂလာပါ၊ ${currentUser.name} (${currentUser.role.toUpperCase()})`;
            loadDashboard();
        } else {
            document.getElementById('loginMsg',).innerText = 'Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။';
        }
    }

    function loadDashboard() {
        let content = document.getElementById('roleContent');
        content.innerHTML = '';

        if (currentUser.role === 'principal') {
            document.getElementById('portalSub').innerText = 'PRINCIPAL PORTAL';
            content.innerHTML = `
                <div class="card-box">
                    <h4>👨‍🏫 ဆရာ/ဆရာမ အကောင့်အသစ် ဖန်တီးရန်</h4>
                    <label>Username</label><input type="text" id="tUser" placeholder="teacher2">
                    <label>Password</label><input type="password" id="tPass" placeholder="123">
                    <label>ဆရာ/မ အမည်</label><input type="text" id="tName" placeholder="ဦးဆောင်ဆရာမ">
                    <button onclick="createTeacherAccount()">ဆရာအကောင့် ဖန်တီးမည်</button>
                </div>
                <div class="card-box">
                    <h4>📋 ဆရာ/မ စာရင်း</h4>
                    <ul>` + JSON.parse(localStorage.getItem('users')).filter(x => x.role === 'teacher').map(t => `<li>${t.name} (${t.user})</li>`).join('') + `</ul>
                </div>
            `;
        } else if (currentUser.role === 'teacher') {
            document.getElementById('portalSub').innerText = 'TEACHER PORTAL (Multi-Question Batch OCR)';
            content.innerHTML = `
                <div class="grid-2">
                    <div class="menu-card" onclick="renderTeacherView('studentAcc')"><h4>👤 ကျောင်းသားအကောင့် ဖန်တီးရန်</h4></div>
                    <div class="menu-card" onclick="renderTeacherView('ocrBank')"><h4>📷 OCR မေးခွန်းဘဏ်</h4></div>
                </div>
                <div id="teacherDynamicView"></div>
            `;
            renderTeacherView('ocrBank');
        } else if (currentUser.role === 'student') {
            document.getElementById('portalSub').innerText = 'STUDENT EXAM PORTAL';
            let qs = JSON.parse(localStorage.getItem('questions_v12')) || [];
            let subjects = [...new Set(qs.map(q => q.sub))];

            content.innerHTML = `
                <div class="card-box">
                    <h4>📚 စာမေးပွဲနှင့် ဘာသာရပ် ရွေးချယ်ရန်</h4>
                    <label><b>ဘာသာရပ် ရွေးချယ်ပါ</b></label>
                    <select id="examSub">
                        ${subjects.map(s => `<option value="${s}">${s}</option>`).join('')}
                    </select>
                    <button onclick="startAttemptQuiz()" style="background:#69F0AE; color:#0A192F; font-size:16px;">🚀 Attempt Quiz (စာမေးပွဲစတင်မည်)</button>
                </div>
                <div class="grid-2">
                    <div class="menu-card" onclick="renderStudentResults()">📊 မိမိ ရလဒ်များ</div>
                    <div class="menu-card" onclick="alert('Student Profile: ' + currentUser.name)">👤 ကိုယ်ရေးအချက်အလက်</div>
                </div>
                <div id="studentDynamicView"></div>
            `;
        }
    }

    function createTeacherAccount() {
        let user = document.getElementById('tUser').value.trim();
        let pass = document.getElementById('tPass').value.trim();
        let name = document.getElementById('tName').value.trim();
        if(!user || !pass || !name) { alert('အချက်အလက် အပြည့်အစုံ ဖြည့်ပါ။'); return; }
        
        let users = JSON.parse(localStorage.getItem('users'));
        users.push({user, pass, role: 'teacher', name});
        localStorage.setItem('users', JSON.stringify(users));
        alert('ဆရာ/မ အကောင့် အောင်မြင်စွာ ဖန်တီးပြီးပါပြီ။');
        loadDashboard();
    }

    function renderTeacherView(type) {
        let view = document.getElementById('teacherDynamicView');
        if (type === 'studentAcc') {
            view.innerHTML = `
                <div class="card-box">
                    <h4>🎓 ကျောင်းသားအကောင့် အသစ်ဖန်တီးရန်</h4>
                    <label>Username</label><input type="text" id="sUser" placeholder="student2">
                    <label>Password</label><input type="password" id="sPass" placeholder="123">
                    <label>ကျောင်းသား အမည်</label><input type="text" id="sName" placeholder="မောင်ဖြိုး">
                    <label>ဘာသာရပ်</label><input type="text" id="sSub" value="Mathematics">
                    <button onclick="createStudentAccount()">ကျောင်းသားအကောင့် ဖန်တီးမည်</button>
                    <h4 style="margin-top:15px;">ကျောင်းသား စာရင်းများ</h4>
                    <ul>` + JSON.parse(localStorage.getItem('users')).filter(x => x.role === 'student').map(s => `<li>${s.name} (${s.user})</li>`).join('') + `</ul>
                </div>`;
        } else if (type === 'ocrBank') {
            let qs = JSON.parse(localStorage.getItem('questions_v12')) || [];
            view.innerHTML = `
                <div class="card-box">
                    <h4>📖 Batch OCR မေးခွန်းများ အလိုအလျောက် ထုတ်ယူရန်</h4>
                    <div class="ocr-box">
                        <label><b>📷 မေးခွန်းပါသော စာရွက်ပုံ တင်ပါ (အမှတ် ၁ မှ ၈ အထိ ပါဝင်သောပုံ)</b></label><br><br>
                        <input type="file" id="ocrImg" accept="image/*" onchange="processBatchOCRQuestions()">
                        <p id="ocrStatus" style="font-size:12px; color:var(--accent-color); margin-top:8px;"></p>
                    </div>
                    <label>ဘာသာရပ်</label><input type="text" id="qSub" value="Mathematics">
                    
                    <button onclick="clearQuestions()" style="background:#ff6b6b; color:#fff; margin-top:10px;">မေးခွန်းများ အားလုံးဖျက်မည်</button>
                    <h4 style="margin-top:15px;">သိမ်းဆည်းပြီး မေးခွန်းများ (${qs.length})</h4>
                    <div id="extractedList">
                        ${qs.map((q, i) => `<div class="q-card"><b>${i+1}. [${q.sub}] ${escapeHtml(q.q)}</b><br><small>A) ${q.optA} | B) ${q.optB} | C) ${q.optC} | D) ${q.optD} [အမှန်: ${q.ans}]</small></div>`).join('')}
                    </div>
                </div>`;
        }
    }

    function createStudentAccount() {
        let user = document.getElementById('sUser').value.trim();
        let pass = document.getElementById('sPass').value.trim();
        let name = document.getElementById('sName').value.trim();
        let subject = document.getElementById('sSub').value.trim();
        if(!user || !pass || !name) { alert('အချက်အလက် ဖြည့်ပါ။'); return; }
        
        let users = JSON.parse(localStorage.getItem('users'));
        users.push({user, pass, role: 'student', name, subject});
        localStorage.setItem('users', JSON.stringify(users));
        alert('ကျောင်းသားအကောင့် အောင်မြင်စွာ ဖန်တီးပြီးပါပြီ။');
        renderTeacherView('studentAcc');
    }

    // --- SMART BATCH OCR (Extracts ALL Questions 1-8 Automatically) ---
    function processBatchOCRQuestions() {
        let fileInput = document.getElementById('ocrImg');
        let status = document.getElementById('ocrStatus');
        let sub = document.getElementById('qSub').value.trim() || 'Mathematics';

        if (fileInput.files.length === 0) return;
        status.innerText = '⏳ ပုံထဲပါ မေးခွန်းအားလုံးကို OCR ဖတ်ယူနေပါသည်...';

        Tesseract.recognize(fileInput.files[0], 'eng', {
            logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဖတ်နေမှု: ${Math.round(m.progress * 100)}%`; }
        }).then(({ data: { text } }) => {
            status.innerText = '✅ မေးခွန်းအားလုံး အောင်မြင်စွာ ထုတ်ယူပြီးပါပြီ။';
            
            // Split text by question numbers (e.g., 1., 2., 3., etc.)
            let rawParts = text.split(/(?=\b\d+\.\s+)/);
            let extractedQuestions = [];

            rawParts.forEach(part => {
                let clean = part.trim();
                if (clean.length > 10) {
                    // Try to separate question text and options A, B, C, D
                    let optA = extractOption(clean, 'A');
                    let optB = extractOption(clean, 'B');
                    let optC = extractOption(clean, 'C');
                    let optD = extractOption(clean, 'D');

                    // Remove question number prefix and options from question body
                    let qBody = clean.replace(/^\d+\.\s*/, '')
                                     .replace(/[aA][\.\)].*?(?=[bB][\.\)]|$)/g, '')
                                     .replace(/[bB][\.\)].*?(?=[cC][\.\)]|$)/g, '')
                                     .replace(/[cC][\.\)].*?(?=[dD][\.\)]|$)/g, '')
                                     .replace(/[dD][\.\)].*$/g, '')
                                     .trim();

                    if (qBody.length > 3) {
                        extractedQuestions.push({
                            id: extractedQuestions.length + 1,
                            sub: sub,
                            q: qBody,
                            optA: optA || 'Option A',
                            optB: optB || 'Option B',
                            optC: optC || 'Option C',
                            optD: optD || 'Option D',
                            ans: 'A' // Default correct answer
                        });
                    }
                }
            });

            if (extractedQuestions.length > 0) {
                let qs = JSON.parse(localStorage.getItem('questions_v12')) || [];
                // Append new extracted questions
                extractedQuestions.forEach(eq => qs.push(eq));
                localStorage.setItem('questions_v12', JSON.stringify(qs));
                alert(`အောင်မြင်ပါသည်! မေးခွန်း ${extractedQuestions.length} ပုဒ် အလိုအလျောက် ဝင်ရောက်သွားပါပြီ။`);
                renderTeacherView('ocrBank');
            } else {
                alert('မေးခွန်းများကို ပုံစံခွဲထုတ်၍ မရပါ။ ကျေးဇူးပြု၍ ရှင်းလင်းသောပုံကို တင်ပါ။');
            }
        }).catch(err => {
            status.innerText = '❌ OCR ဖတ်ရှုရာတွင် အမှားရှိသည်။';
            console.error(err);
        });
    }

    function extractOption(text, optChar) {
        let regex = new RegExp(`(?:[^\\w]|^)${optChar}[\\.\\)]\\s*(.*?)(?=(?:[^\\w]|^)[a-dA-D][\\.\\)]|$)`, 'i');
        let m = text.match(regex);
        return m ? m[1].trim() : '';
    }

    function clearQuestions() {
        if(confirm('မေးခွန်းအားလုံး ဖျက်မည်မှာ သေချာပါသလား?')) {
            localStorage.setItem('questions_v12', JSON.stringify([]));
            renderTeacherView('ocrBank');
        }
    }

    // --- STUDENT ATTEMPT QUIZ (Multi-Questions Scroll View) ---
    function startAttemptQuiz() {
        let selectedSub = document.getElementById('examSub').value;
        let qs = (JSON.parse(localStorage.getItem('questions_v12')) || []).filter(q => q.sub === selectedSub);
        
        if(qs.length === 0) { alert('ဤဘာသာရပ်အတွက် မေးခွန်း မရှိသေးပါ။'); return; }
        
        studentAnswers = {}; // reset

        let html = `
            <div class="card-box" style="text-align:left;">
                <h3>📜 ${selectedSub} Exam (Scroll to Answer)</h3>
                <p style="font-size:12px; color:var(--text-muted);">မေးခွန်းအားလုံး (${qs.length} ပုဒ်) ကို အောက်သို့ Scroll ဆွဲ၍ ဖြေဆိုပါ။ ပြီးလျှင် Finished ကိုနှိပ်ပါ။</p>
                <form id="quizForm">`;

        qs.forEach((q, index) => {
            html += `
                <div class="q-card">
                    <p><b>မေးခွန်း ${index + 1}။</b> ${escapeHtml(q.q)}</p>
                    <div class="option-item"><input type="radio" name="q_${q.id}" value="A" onchange="storeAns(${q.id}, 'A')"><label>A) ${escapeHtml(q.optA || '')}</label></div>
                    <div class="option-item"><input type="radio" name="q_${q.id}" value="B" onchange="storeAns(${q.id}, 'B')"><label>B) ${escapeHtml(q.optB || '')}</label></div>
                    <div class="option-item"><input type="radio" name="q_${q.id}" value="C" onchange="storeAns(${q.id}, 'C')"><label>C) ${escapeHtml(q.optC || '')}</label></div>
                    <div class="option-item"><input type="radio" name="q_${q.id}" value="D" onchange="storeAns(${q.id}, 'D')"><label>D) ${escapeHtml(q.optD || '')}</label></div>
                </div>`;
        });

        html += `</form>
                 <button onclick="finishExam('${selectedSub}')" style="background:#FFD700; color:#0A192F; font-size:16px; margin-top:15px;">🏁 Finished (စစ်ဆေးမည်)</button>
            </div>`;
        document.getElementById('studentDynamicView').innerHTML = html;
    }

    function storeAns(qId, val) {
        studentAnswers[qId] = val;
    }

    // --- FINISHED & REVIEW SYSTEM ---
    function finishExam(sub) {
        let qs = (JSON.parse(localStorage.getItem('questions_v12')) || []).filter(q => q.sub === sub);
        let answeredCount = Object.keys(studentAnswers).length;
        let unanswCount = qs.length - answeredCount;

        let reviewHtml = `
            <div class="card-box" style="text-align:left;">
                <h3>📋 Exam Summary & Review</h3>
                <p><b>ဖြေဆိုပြီး (Answered):</b> <span style="color:#69F0AE;">${answeredCount} ပုဒ်</span></p>
                <p><b>မဖြေရသေး (Not Answered):</b> <span style="color:#ff6b6b;">${unanswCount} ပုဒ်</span></p>
                <hr style="border-color:rgba(255,215,0,0.2);">
                <h4>မေးခွန်း တစ်ခုချင်းစီ အခြေအနေ:</h4>`;

        qs.forEach((q, idx) => {
            let status = studentAnswers[q.id] ? `<span style="color:#69F0AE;">Answered (Option ${studentAnswers[q.id]})</span>` : `<span style="color:#ff6b6b; font-weight:bold;">Not Answered</span>`;
            reviewHtml += `<div style="font-size:13px; margin-bottom:5px;"><b>မေးခွန်း ${idx+1}:</b> ${status}</div>`;
        });

        reviewHtml += `
                <button onclick="startAttemptQuiz()" style="background:#8892B0; color:#fff; margin-top:10px;">✏️ Review (ပြန်လည်ပြင်ဆင်ရန်)</button>
                <button onclick="confirmSubmit('${sub}')" style="background:#69F0AE; color:#0A192F; font-size:16px; margin-top:10px;">📤 Submit (နောက်ဆုံးတင်သွင်းမည်)</button>
            </div>`;
        document.getElementById('studentDynamicView').innerHTML = reviewHtml;
    }

    // --- FINAL SUBMIT & CONFIRMATION ---
    function confirmSubmit(sub) {
        if(!confirm('သင်၏ အဖြေများကို နောက်ဆုံးအကြိမ်အဖြစ် Submit လုပ်ရန် သေချာပါသလား?')) return;

        let qs = (JSON.parse(localStorage.getItem('questions_v12')) || []).filter(q => q.sub === sub);
        let score = 0;
        qs.forEach(q => {
            if(studentAnswers[q.id] === q.ans) score += (100 / qs.length);
        });

        let finalScore = Math.round(score);
        let grade = finalScore >= 80 ? 'A+' : (finalScore >= 50 ? 'B' : 'C');
        let dateStr = new Date().toLocaleDateString();

        let results = JSON.parse(localStorage.getItem('results'));
        results.push({ student: currentUser.name, subject: sub, score: finalScore, total: 100, grade, date: dateStr });
        localStorage.setItem('results', JSON.stringify(results));

        let slip = `CHINDWIN FUTURE BRIGHT SCHOOL
--------------------------------
EXAM RESULT SLIP (FINAL SUBMIT)
--------------------------------
Student : ${currentUser.name}
Subject : ${sub}
Score   : ${finalScore} / 100
Grade   : ${grade}
Date    : ${dateStr}
--------------------------------
Thermal Printer Ready`;

        document.getElementById('studentDynamicView').innerHTML = `
            <p style="color: #69F0AE; text-align: center; font-weight: bold; font-size:16px;">စာမေးပွဲ အောင်မြင်စွာ တင်သွင်းပြီးပါပြီ (Submitted)!</p>
            <div class="receipt">${slip}</div>
            <button onclick="window.print()" style="background-color: #69F0AE; color: #0A192F;">🖨️ 2-inch Thermal Printer ဖြင့် Print ထုတ်မည်</button>
            <button onclick="loadDashboard()" style="margin-top:10px;">ပင်မစာမျက်နှာသို့ ပြန်ရန်</button>
        `;
    }

    function renderStudentResults() {
        let res = JSON.parse(localStorage.getItem('results'));
        let html = `<div class="card-box"><h4>📊 မိမိ၏ စာမေးပွဲ ရလဒ်များ</h4>`;
        let myRes = res.filter(r => r.student === currentUser.name);
        if(myRes.length === 0) { html += `<p style="text-align:center;">မှတ်တမ်း မရှိသေးပါ။</p>`; }
        else {
            myRes.forEach(r => {
                html += `<div class="q-card"><b>ဘာသာရပ်: ${r.subject}</b><br>ရမှတ်: ${r.score}/${r.total} (Grade: ${r.grade})<br><small>ရက်စွဲ: ${r.date}</small></div>`;
            });
        }
        html += `</div>`;
        document.getElementById('studentDynamicView').innerHTML = html;
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function logout() {
        currentUser = null;
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginMsg').innerText = '';
        document.getElementById('portalSub').innerText = 'SMART EXAMINATION SYSTEM';
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }
</script>

</body>
</html>
