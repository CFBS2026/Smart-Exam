<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHINDWIN FUTURE BRIGHT SCHOOL - Smart Exam System</title>

    <!-- Tesseract.js (OCR Engine) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        :root {
            --bg-color: #0A192F;
            --card-bg: #112240;
            --card-sub: #1D3557;
            --accent-color: #FFD700;
            --text-color: #FFFFFF;
            --text-muted: #8892B0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h2, h3, h4 {
            color: var(--accent-color);
            text-align: center;
            margin-top: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            background-color: #0A192F;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { opacity: 0.9; }
        .hidden { display: none !important; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }
        .menu-card {
            background: var(--card-sub);
            padding: 15px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.2);
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }
        .menu-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .menu-card h4 {
            margin: 0 0 4px 0;
            color: #FFFFFF;
            font-size: 15px;
            text-align: left;
        }
        .menu-card p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }
        .section-title {
            color: var(--accent-color);
            font-size: 15px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            padding-bottom: 5px;
            margin: 20px 0 10px 0;
        }
        .card-box {
            background: var(--card-sub);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,215,0,0.2);
            text-align: left;
        }
        .ocr-box {
            border: 2px dashed var(--accent-color);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
            background: rgba(255,215,0,0.05);
        }
        .q-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--accent-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: left;
        }
        .option-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            display: flex;
            align-items: center;
        }
        .option-item input[type="radio"] {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }
        .option-item label { cursor: pointer; width: 100%; }
        
        @media print {
            body * { visibility: hidden; }
            .printable-receipt, .printable-receipt * { visibility: visible; }
            .printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm;
                background: #fff;
                color: #000;
                font-family: monospace;
                padding: 5px;
            }
        }
        .receipt {
            background: #fff;
            color: #000;
            padding: 15px;
            font-family: monospace;
            border-radius: 8px;
            white-space: pre-wrap;
            margin-top: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid rgba(255,215,0,0.3);
            padding: 8px;
            text-align: left;
        }
        th { color: var(--accent-color); }
    </style>
</head>
<body>

<div class="container">
    <h2>CHINDWIN FUTURE BRIGHT SCHOOL</h2>
    <div class="subtitle" id="portalSub">SMART EXAMINATION SYSTEM</div>

    <!-- 1. Login Screen -->
    <div id="loginSection">
        <h3>အကောင့်ဝင်ရန် (Login)</h3>
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="principal / teacher / student">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="123">
        <button onclick="handleLogin()">ဝင်မည် (Login)</button>
        <p id="loginMsg" style="color: #ff6b6b; text-align: center;"></p>
    </div>

    <!-- 2. Main Dashboard Container -->
    <div id="dashboardSection" class="hidden">
        <h3 id="welcomeText" style="color: #69F0AE;"></h3>
        <div id="roleContent"></div>
        <button onclick="logout()" style="background-color: #ff6b6b; color: #fff; margin-top: 25px;">ထွက်ရန် (Logout)</button>
    </div>
</div>

<script>
    const gradeList = [
        "KG", "Grade 1", "Grade 2", "Grade 3", "Grade 4", "Grade 5", 
        "Grade 6", "Grade 7", "Grade 8", "Grade 9", "Grade 10", "Grade 11", "Grade 12"
    ];

    function getSubjectsByGrade(grade) {
        if (["KG", "Grade 1", "Grade 2", "Grade 3", "Grade 4", "Grade 5"].includes(grade)) {
            return ["မြန်မာစာ", "အင်္ဂလိပ်စာ", "သင်္ချာ", "လူမှုရေး", "သိပ္ပံ"];
        } else if (["Grade 6", "Grade 7", "Grade 8", "Grade 9"].includes(grade)) {
            return ["မြန်မာစာ", "အင်္ဂလိပ်စာ", "သင်္ချာ", "ပထဝီဝင်", "သမိုင်း", "သိပ္ပံ"];
        } else {
            return ["မြန်မာစာ", "အင်္ဂလိပ်စာ", "သင်္ချာ", "ဓာတုဗေဒ", "ရူပဗေဒ", "ဇီဝဗေဒ", "ဘောဂဗေဒ", "ပထဝီဝင်", "သမိုင်း", "သိပ္ပံ"];
        }
    }

    const examTypes = ["ပထမလပတ်", "ဒုတိယလပတ်", "တတိယလပတ်", "စတုတ္ထပတ်", "အတန်းတင်စာမေးပွဲ"];

    if (!localStorage.getItem('users')) {
        localStorage.setItem('users', JSON.stringify([
            {user: 'principal', pass: '123', role: 'principal', name: 'ကျောင်းအုပ်ကြီး'},
            {user: 'teacher', pass: '123', role: 'teacher', name: 'ဦးဆောင်ဆရာမ'},
            {user: 'student', pass: '123', role: 'student', name: 'မောင်ကျောင်းသား', grade: 'Grade 6', roll: 'CFBS-001'}
        ]));
    }
    if (!localStorage.getItem('questions_v22')) {
        localStorage.setItem('questions_v22', JSON.stringify([
            {id: 1, grade: 'Grade 6', sub: 'သင်္ချာ', q: 'If z1 = 6-17i, z2 = 3-bi and z1/z2 = 4-3i, then b is', optA: '1', optB: '2', optC: '3', optD: '4', ans: 'A'}
        ]));
    }
    if (!localStorage.getItem('results')) localStorage.setItem('results', JSON.stringify([]));

    let currentUser = null;
    let activeExamData = { questions: [], studentAnswers: {}, totalMarks: 25, subject: '', examType: '' };

    function handleLogin() {
        let u = document.getElementById('loginUser').value.trim();
        let p = document.getElementById('loginPass').value.trim();
        let users = JSON.parse(localStorage.getItem('users'));

        let found = users.find(x => x.user === u && x.pass === p);
        if (found) {
            currentUser = found;
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('welcomeText').innerText = `မင်္ဂလာပါ၊ ${currentUser.name} (${currentUser.role.toUpperCase()})`;
            loadDashboard();
        } else {
            document.getElementById('loginMsg').innerText = 'Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။';
        }
    }

    function loadDashboard() {
        let content = document.getElementById('roleContent');
        content.innerHTML = '';

        if (currentUser.role === 'principal') {
            document.getElementById('portalSub').innerText = 'PRINCIPAL ADMINISTRATION';
            content.innerHTML = `
                <h3 style="text-align:left; color:var(--accent-color);">Principal Dashboard</h3>
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('studentMgmt')"><h4>👥 Students</h4><p>ကျောင်းသား စာရင်း</p></div>
                    <div class="menu-card" onclick="renderView('teacherMgmt')"><h4>🎓 Teachers</h4><p>ဆရာ/ဆရာမ စာရင်း</p></div>
                    <div class="menu-card" onclick="renderView('exams')"><h4>📋 Examinations</h4><p>စာမေးပွဲများ</p></div>
                    <div class="menu-card" onclick="renderView('questions')"><h4>📖 Question Bank</h4><p>မေးခွန်းဘဏ် (OCR)</p></div>
                </div>

                <div class="section-title">Management Menu</div>
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('studentMgmt')"><h4>👥 Student Management</h4><p>ကျောင်းသားစီမံခန့်ခွဲမှု</p></div>
                    <div class="menu-card" onclick="renderView('teacherMgmt')"><h4>🎓 Teacher Management</h4><p>ဆရာစီမံခန့်ခွဲမှု</p></div>
                    <div class="menu-card" onclick="renderView('subjects')"><h4>📚 Class & Subjects</h4><p>အတန်းနှင့်ဘာသာရပ်များ</p></div>
                    <div class="menu-card" onclick="renderView('questions')"><h4>📖 Question Bank</h4><p>မေးခွန်းဘဏ်</p></div>
                    <div class="menu-card" onclick="renderView('createExam')"><h4>✍️ Create Examination</h4><p>စာမေးပွဲဖန်တီးရန်</p></div>
                    <div class="menu-card" onclick="renderView('schedule')"><h4>📅 Exam Schedule</h4><p>စာမေးပွဲအချိန်ဇယား</p></div>
                    <div class="menu-card" onclick="renderView('reports')"><h4>📊 Results & Reports</h4><p>ရလဒ်များနှင့် အစီရင်ခံစာ</p></div>
                    <div class="menu-card" onclick="renderView('backup')"><h4>⚙️ Security & Backup</h4><p>ဒေတာသိမ်းဆည်းမှု</p></div>
                </div>
                <div id="dynamicView"></div>
            `;
        } else if (currentUser.role === 'teacher') {
            document.getElementById('portalSub').innerText = 'CFBS TEACHER PANEL - EXAM MANAGEMENT';
            content.innerHTML = `
                <h3 style="text-align:left; color:var(--accent-color);">Teacher Dashboard</h3>
                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('studentMgmt')"><h4>👥 Students</h4><p>ကျောင်းသားစာရင်းစစ်ဆေးမှု</p></div>
                    <div class="menu-card" onclick="renderView('questions')"><h4>📖 Question Bank</h4><p>မေးခွန်းဘဏ်</p></div>
                    <div class="menu-card" onclick="renderView('createExam')"><h4>✍️ Create Exam</h4><p>စာမေးပွဲဖန်တီးရန်</p></div>
                    <div class="menu-card" onclick="renderView('backup')"><h4>📥 Import / Export</h4><p>မေးခွန်းဖိုင်ပို့ပပို့/ယူ</p></div>
                    <div class="menu-card" onclick="renderView('reports')"><h4>📊 Exam Results</h4><p>စာမေးပွဲရလဒ်</p></div>
                    <div class="menu-card" onclick="renderView('subjects')"><h4>📚 Subjects & Chapters</h4><p>ဘာသာရပ်နှင့်အခန်းများ</p></div>
                    <div class="menu-card" onclick="renderView('schedule')"><h4>📅 Exam Schedule</h4><p>စာမေးပွဲအချိန်ဇယား</p></div>
                    <div class="menu-card" onclick="alert('Settings menu active')"><h4>⚙️ Settings</h4><p>စနစ်သတ်မှတ်ချက်</p></div>
                </div>
                <div id="dynamicView"></div>
            `;
            renderView('questions');
        } else if (currentUser.role === 'student') {
            document.getElementById('portalSub').innerText = 'STUDENT EXAM PORTAL';
            let studentGrade = currentUser.grade || "Grade 6";
            let studentRoll = currentUser.roll || "CFBS-001";
            let availableSubs = getSubjectsByGrade(studentGrade);

            content.innerHTML = `
                <div class="card-box" style="background:rgba(255,215,0,0.05);">
                    <p><b>ကျောင်းသားအမည်:</b> ${currentUser.name}</p>
                    <p><b>အတန်းအမည်:</b> ${studentGrade}</p>
                    <p><b>ကျောင်းဝင်အမှတ် (Roll No):</b> ${studentRoll}</p>
                </div>

                <div class="card-box">
                    <h4>📚 စာမေးပွဲ ဖြေဆိုရန် ရွေးချယ်ပါ</h4>
                    
                    <label><b>စာမေးပွဲအမျိုးအစား (Exam Type)</b></label>
                    <select id="examTypeSelect">
                        ${examTypes.map(et => `<option value="${et}">${et}</option>`).join('')}
                    </select>

                    <label><b>ဘာသာရပ် (Subject)</b></label>
                    <select id="examSub">
                        ${availableSubs.map(s => `<option value="${s}">${s}</option>`).join('')}
                    </select>

                    <label><b>မေးခွန်းအမှတ် သတ်မှတ်ချက် (Marks & Questions)</b></label>
                    <select id="examMarks">
                        <option value="25">25 မှတ်ဖိုး (25 ပုဒ်)</option>
                        <option value="50">50 မှတ်ဖိုး (50 ပုဒ်)</option>
                        <option value="100" selected>100 မှတ်ဖိုး (100 ပုဒ်)</option>
                    </select>

                    <button onclick="startAttemptQuiz()" style="background:#69F0AE; color:#0A192F; font-size:16px; margin-top:10px;">🚀 Attempt Quiz (စာမေးပွဲစတင်မည်)</button>
                </div>

                <div class="grid-2">
                    <div class="menu-card" onclick="renderView('myResults')"><h4>📊 My Results</h4><p>မိမိ ရလဒ်များ</p></div>
                    <div class="menu-card" onclick="alert('Student Profile: ' + currentUser.name + ' | ' + studentGrade)"><h4>👤 My Profile</h4><p>ကိုယ်ရေးအချက်အလက်</p></div>
                </div>
                <div id="dynamicView"></div>
            `;
        }
    }

    function renderView(type) {
        let view = document.getElementById('dynamicView');
        if (!view) return;

        if (type === 'questions') {
            let qs = JSON.parse(localStorage.getItem('questions_v22')) || [];
            view.innerHTML = `
                <div class="card-box">
                    <h4>📖 Batch OCR & JSON Import မေးခွန်းများ</h4>
                    
                    <label><b>၁။ အတန်းအဆင့် (Grade) ရွေးချယ်ပါ</b></label>
                    <select id="qGrade" onchange="updateSubjectDropdown()">
                        ${gradeList.map(g => `<option value="${g}">${g}</option>`).join('')}
                    </select>

                    <label><b>၂။ ဘာသာရပ် ရွေးချယ်ပါ</b></label>
                    <select id="qSub"></select>

                    <div class="ocr-box">
                        <label><b>📷 မေးခွန်းပါသော စာရွက်ပုံ တင်ပါ (OCR)</b></label><br><br>
                        <input type="file" id="ocrImg" accept="image/*" onchange="processBatchOCRQuestions()">
                        <p id="ocrStatus" style="font-size:12px; color:var(--accent-color); margin-top:8px;"></p>
                    </div>

                    <label><b>📥 ဆရာ့ဖိုင်မှ JSON မေးခွန်းများ Import လုပ်ရန်</b></label>
                    <input type="file" id="jsonFile" accept=".json" onchange="importJSONQuestions(event)">

                    <button onclick="clearQuestions()" style="background:#ff6b6b; color:#fff; margin-top:10px;">မေးခွန်းများ အားလုံးဖျက်မည်</button>
                    
                    <h4 style="margin-top:20px;">သိမ်းဆည်းထားသော မေးခွန်းများ (${qs.length})</h4>
                    <div id="extractedList">
                        ${qs.map((q, i) => `<div class="q-card"><b>${i+1}. [${q.grade} - ${q.sub}] ${escapeHtml(q.q)}</b><br><small>A) ${q.optA} | B) ${q.optB} | C) ${q.optC} | D) ${q.optD} [အမှန်: ${q.ans}]</small></div>`).join('')}
                    </div>
                </div>`;
            updateSubjectDropdown();
        } else if (type === 'studentMgmt') {
            let users = JSON.parse(localStorage.getItem('users'));
            view.innerHTML = `
                <div class="card-box">
                    <h4>🎓 ကျောင်းသားအကောင့် အသစ်ဖန်တီးရန်</h4>
                    <label>Username</label><input type="text" id="sUser" placeholder="student2">
                    <label>Password</label><input type="password" id="sPass" placeholder="123">
                    <label>ကျောင်းသား အမည်</label><input type="text" id="sName" placeholder="မောင်ဖြိုး">
                    <label>ကျောင်းဝင်အမှတ် (Roll No)</label><input type="text" id="sRoll" placeholder="CFBS-002">
                    <label>အတန်းအဆင့် (Grade)</label>
                    <select id="sGrade">
                        ${gradeList.map(g => `<option value="${g}">${g}</option>`).join('')}
                    </select>
                    <button onclick="createAccount('student')">ကျောင်းသားအကောင့် ဖန်တီးမည်</button>
                    <h4 style="margin-top:15px;">ကျောင်းသား စာရင်းများ</h4>
                    <ul>` + users.filter(x => x.role === 'student').map(s => `<li>${s.name} (${s.user}) - [${s.grade}] Roll: ${s.roll}</li>`).join('') + `</ul>
                </div>`;
        } else if (type === 'teacherMgmt') {
            let users = JSON.parse(localStorage.getItem('users'));
            view.innerHTML = `
                <div class="card-box">
                    <h4>👨‍🏫 ဆရာ/ဆရာမ အကောင့်အသစ် ဖန်တီးရန်</h4>
                    <label>Username</label><input type="text" id="tUser" placeholder="teacher2">
                    <label>Password</label><input type="password" id="tPass" placeholder="123">
                    <label>ဆရာ/မ အမည်</label><input type="text" id="tName" placeholder="ဒေါ်လှလှ">
                    <button onclick="createAccount('teacher')">ဆရာအကောင့် ဖန်တီးမည်</button>
                    <h4 style="margin-top:15px;">ဆရာ/မ စာရင်းများ</h4>
                    <ul>` + users.filter(x => x.role === 'teacher').map(t => `<li>${t.name} (${t.user})</li>`).join('') + `</ul>
                </div>`;
        } else if (type === 'createExam') {
            view.innerHTML = `<div class="card-box"><h4>✍️ စာမေးပွဲအသစ် ဖန်တီးရန်</h4>
                <input type="text" id="exTitle" placeholder="စာမေးပွဲခေါင်းစဉ်">
                <input type="text" id="exSub" placeholder="ဘာသာရပ်">
                <input type="text" id="exMarks" placeholder="စုစုပေါင်းရမှတ်">
                <button onclick="alert('စာမေးပွဲ သိမ်းဆည်းပြီးပါပြီ။')">စာမေးပွဲ သိမ်းဆည်းမည်</button></div>`;
        } else if (type === 'subjects') {
            view.innerHTML = `<div class="card-box"><h4>📚 Class & Subjects</h4><p>KG to Grade 12 curriculum active.</p></div>`;
        } else if (type === 'schedule') {
            view.innerHTML = `<div class="card-box"><h4>📅 Exam Schedule</h4><p>Exam timetable is active.</p></div>`;
        } else if (type === 'reports' || type === 'myResults') {
            let res = JSON.parse(localStorage.getItem('results'));
            let html = `<div class="card-box"><h4>📊 စာမေးပွဲ ရလဒ်များ</h4>`;
            if (res.length === 0) { html += `<p style="text-align:center;">မှတ်တမ်း မရှိသေးပါ။</p>`; }
            else {
                html += `<table><tr><th>ကျောင်းသား</th><th>စာမေးပွဲအမျိုးအစား</th><th>ဘာသာရပ်</th><th>ရမှတ်</th><th>ဂရိတ်</th></tr>`;
                res.forEach(r => {
                    if(currentUser.role === 'student' && r.student !== currentUser.name) return;
                    html += `<tr><td>${r.student}</td><td>${r.examType || '-'}</td><td>${r.subject}</td><td>${r.score}/${r.total}</td><td>${r.grade}</td></tr>`;
                });
                html += `</table>`;
            }
            html += `</div>`;
            view.innerHTML = html;
        } else if (type === 'backup') {
            view.innerHTML = `<div class="card-box"><h4>⚙️ Import / Export Database</h4>
                <button onclick="exportData()">Export Database (JSON)</button></div>`;
        }
    }

    function updateSubjectDropdown() {
        let gradeSelect = document.getElementById('qGrade');
        let subSelect = document.getElementById('qSub');
        if (!gradeSelect || !subSelect) return;

        let selectedGrade = gradeSelect.value;
        let subs = getSubjectsByGrade(selectedGrade);
        subSelect.innerHTML = subs.map(s => `<option value="${s}">${s}</option>`).join('');
    }

    function createAccount(role) {
        let uInput = role === 'teacher' ? 'tUser' : 'sUser';
        let pInput = role === 'teacher' ? 'tPass' : 'sPass';
        let nInput = role === 'teacher' ? 'tName' : 'sName';
        let u = document.getElementById(uInput).value.trim();
        let p = document.getElementById(pInput).value.trim();
        let n = document.getElementById(nInput).value.trim();
        let grade = role === 'student' ? document.getElementById('sGrade').value : 'Grade 6';
        let roll = role === 'student' ? document.getElementById('sRoll').value.trim() : 'ADMIN';

        if(!u || !p || !n) { alert('အချက်အလက် ဖြည့်ပါ။'); return; }
        let users = JSON.parse(localStorage.getItem('users'));
        users.push({user: u, pass: p, role: role, name: n, grade: grade, roll: roll});
        localStorage.setItem('users', JSON.stringify(users));
        alert('အကောင့် အောင်မြင်စွာ ဖန်တီးပြီးပါပြီ။');
        renderView(role === 'teacher' ? 'teacherMgmt' : 'studentMgmt');
    }

    function importJSONQuestions(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let imported = JSON.parse(e.target.result);
                let qs = JSON.parse(localStorage.getItem('questions_v22')) || [];
                imported.forEach(q => qs.push(q));
                localStorage.setItem('questions_v22', JSON.stringify(qs));
                alert(`ဆရာ့ဖိုင်မှ မေးခွန်း ${imported.length} ပုဒ် အောင်မြင်စွာ Import လုပ်ပြီးပါပြီ။`);
                renderView('questions');
            } catch(err) {
                alert('JSON ဖိုင် ဖတ်ရှုရာတွင် အမှားအယွင်း ရှိနေပါသည်။');
            }
        };
        reader.readAsText(file);
    }

    function processBatchOCRQuestions() {
        let fileInput = document.getElementById('ocrImg');
        let status = document.getElementById('ocrStatus');
        let gradeInput = document.getElementById('qGrade').value;
        let subInput = document.getElementById('qSub').value;
        if (fileInput.files.length === 0) return;

        status.innerText = '⏳ မေးခွန်းစာရွက်ပုံထဲမှ မေးခွန်းအားလုံးကို OCR ဖတ်ယူနေပါသည်...';

        Tesseract.recognize(fileInput.files[0], 'eng', {
            logger: m => { if(m.status === 'recognizing text') status.innerText = `⏳ ဖတ်ရှုမှု: ${Math.round(m.progress * 100)}%`; }
        }).then(({ data: { text } }) => {
            status.innerText = '✅ မေးခွန်းများ ဖတ်ယူပြီးပါပြီ။';
            let rawParts = text.split(/(?=\b\d+\.\s+)/);
            let extracted = [];

            rawParts.forEach(part => {
                let clean = part.trim();
                if (clean.length > 10) {
                    let optA = extractOption(clean, 'A');
                    let optB = extractOption(clean, 'B');
                    let optC = extractOption(clean, 'C');
                    let optD = extractOption(clean, 'D');

                    let qBody = clean.replace(/^\d+\.\s*/, '')
                                     .replace(/[aA][\.\)].*?(?=[bB][\.\)]|$)/g, '')
                                     .replace(/[bB][\.\)].*?(?=[cC][\.\)]|$)/g, '')
                                     .replace(/[cC][\.\)].*?(?=[dD][\.\)]|$)/g, '')
                                     .replace(/[dD][\.\)].*$/g, '')
                                     .trim();

                    if (qBody.length > 3) {
                        extracted.push({
                            id: Date.now() + Math.random(),
                            grade: gradeInput,
                            sub: subInput,
                            q: qBody,
                            optA: optA || '1',
                            optB: optB || '2',
                            optC: optC || '3',
                            optD: optD || '4',
                            ans: 'A'
                        });
                    }
                }
            });

            if (extracted.length > 0) {
                let qs = JSON.parse(localStorage.getItem('questions_v22')) || [];
                extracted.forEach(eq => qs.push(eq));
                localStorage.setItem('questions_v22', JSON.stringify(qs));
                alert(`(${gradeInput} - ${subInput}) အတွက် မေးခွန်း ${extracted.length} ပုဒ် အလိုအလျောက် ဝင်ရောက်သွားပါပြီ။`);
                renderView('questions');
            } else {
                alert('မေးခွန်း စာသားများကို သီးခြား ခွဲထုတ်၍ မရပါ။');
            }
        }).catch(err => { status.innerText = '❌ OCR ဖတ်ရှုရာတွင် အမှားရှိသည်။'; });
    }

    function extractOption(text, optChar) {
        let regex = new RegExp(`(?:[^\\w]|^)${optChar}[\\.\\)]\\s*(.*?)(?=(?:[^\\w]|^)[a-dA-D][\\.\\)]|$)`, 'i');
        let m = text.match(regex);
        return m ? m[1].trim() : '';
    }

    function clearQuestions() {
        if(confirm('မေးခွန်းအားလုံး ဖျက်မည်မှာ သေချာပါသလား?')) {
            localStorage.setItem('questions_v22', JSON.stringify([]));
            renderView('questions');
        }
    }

    function exportData() {
        let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
        let dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", "cfbs_exam_backup.json");
        dlAnchor.click();
    }

    // --- STUDENT ATTEMPT QUIZ ---
    function startAttemptQuiz() {
        let selectedSub = document.getElementById('examSub').value;
        let selectedExamType = document.getElementById('examTypeSelect').value;
        let requiredMarks = parseInt(document.getElementById('examMarks').value) || 25;
        let studentGrade = currentUser.grade || "Grade 6";
        
        let allQs = (JSON.parse(localStorage.getItem('questions_v22')) || []).filter(q => q.grade === studentGrade && q.sub === selectedSub);
        if(allQs.length === 0) { alert(`ဤဘာသာရပ် (${selectedSub}) အတွက် မေးခွန်း မရှိသေးပါ။`); return; }

        let shuffled = allQs.sort(() => 0.5 - Math.random());
        let selectedQs = shuffled.slice(0, requiredMarks);

        activeExamData = { questions: selectedQs, studentAnswers: {}, totalMarks: requiredMarks, subject: selectedSub, examType: selectedExamType };

        renderQuizForm();
    }

    function renderQuizForm() {
        let selectedSub = activeExamData.subject;
        let studentGrade = currentUser.grade || "Grade 6";
        let selectedQs = activeExamData.questions;
        let requiredMarks = activeExamData.totalMarks;
        let examType = activeExamData.examType;

        let html = `
            <div class="card-box" style="text-align:left;">
                <h3>📜 ${examType} - ${selectedSub} Exam (${studentGrade}) - ${requiredMarks} Marks</h3>
                <p style="font-size:12px; color:var(--text-muted);">မေးခွန်း ${selectedQs.length} ပုဒ်ကို အောက်သို့ Scroll ဆွဲ၍ ဖြေဆိုပါ။ ပြီးလျှင် Finished ကိုနှိပ်ပါ။</p>
                <form id="quizForm">`;

        selectedQs.forEach((q, index) => {
            let currentAns = activeExamData.studentAnswers[q.id] || '';
            html += `
                <div class="q-card">
                    <p><b>မေးခွန်း ${index + 1}။</b> ${escapeHtml(q.q)}</p>
                    <div class="option-item"><input type="radio" id="optA_${q.id}" name="q_${q.id}" value="A" ${currentAns === 'A' ? 'checked' : ''} onchange="storeAns('${q.id}', 'A')"><label for="optA_${q.id}">A) ${escapeHtml(q.optA || '')}</label></div>
                    <div class="option-item"><input type="radio" id="optB_${q.id}" name="q_${q.id}" value="B" ${currentAns === 'B' ? 'checked' : ''} onchange="storeAns('${q.id}', 'B')"><label for="optB_${q.id}">B) ${escapeHtml(q.optB || '')}</label></div>
                    <div class="option-item"><input type="radio" id="optC_${q.id}" name="q_${q.id}" value="C" ${currentAns === 'C' ? 'checked' : ''} onchange="storeAns('${q.id}', 'C')"><label for="optC_${q.id}">C) ${escapeHtml(q.optC || '')}</label></div>
                    <div class="option-item"><input type="radio" id="optD_${q.id}" name="q_${q.id}" value="D" ${currentAns === 'D' ? 'checked' : ''} onchange="storeAns('${q.id}', 'D')"><label for="optD_${q.id}">D) ${escapeHtml(q.optD || '')}</label></div>
                </div>`;
        });

        html += `</form>
                 <button onclick="finishExam()" style="background:#FFD700; color:#0A192F; font-size:16px; margin-top:15px;">🏁 Finished (စစ်ဆေးမည်)</button>
            </div>`;
        document.getElementById('roleContent').innerHTML = html;
    }

    function storeAns(qId, val) {
        if (!activeExamData.studentAnswers) activeExamData.studentAnswers = {};
        activeExamData.studentAnswers[qId] = val;
    }

    function finishExam() {
        let qs = activeExamData.questions;
        if (!activeExamData.studentAnswers) activeExamData.studentAnswers = {};
        let answeredCount = Object.keys(activeExamData.studentAnswers).length;
        let unanswCount = qs.length - answeredCount;

        let reviewHtml = `
            <div class="card-box" style="text-align:left;">
                <h3>📋 Exam Summary & Review</h3>
                <p><b>ဖြေဆိုပြီး (Answered):</b> <span style="color:#69F0AE;">${answeredCount} ပုဒ်</span></p>
                <p><b>မဖြေရသေး (Not Answered):</b> <span style="color:#ff6b6b;">${unanswCount} ပုဒ်</span></p>
                <hr style="border-color:rgba(255,215,0,0.2);">
                <h4>မေးခွန်း တစ်ခုချင်းစီ အခြေအနေ:</h4>`;

        qs.forEach((q, idx) => {
            let status = activeExamData.studentAnswers[q.id] ? `<span style="color:#69F0AE;">Answered (Option ${activeExamData.studentAnswers[q.id]})</span>` : `<span style="color:#ff6b6b; font-weight:bold;">Not Answered</span>`;
            reviewHtml += `<div style="font-size:13px; margin-bottom:5px;"><b>မေးခွန်း ${idx+1}:</b> ${status}</div>`;
        });

        reviewHtml += `
                <button onclick="renderQuizForm()" style="background:#8892B0; color:#fff; margin-top:10px;">✏️ Review (ပြန်လည်ပြင်ဆင်ရန်)</button>
                <button onclick="confirmSubmit()" style="background:#69F0AE; color:#0A192F; font-size:16px; margin-top:10px;">📤 Submit (နောက်ဆုံးတင်သွင်းမည်)</button>
            </div>`;
        document.getElementById('roleContent').innerHTML = reviewHtml;
    }

    function confirmSubmit() {
        if(!confirm('သင်၏ အဖြေများကို နောက်ဆုံးအကြိမ်အဖြစ် Submit လုပ်ရန် သေချာပါသလား?')) return;

        let qs = activeExamData.questions;
        if (!activeExamData.studentAnswers) activeExamData.studentAnswers = {};
        let score = 0;
        qs.forEach(q => {
            if(activeExamData.studentAnswers[q.id] === q.ans) score += (100 / qs.length);
        });

        let finalScore = Math.round((score * activeExamData.totalMarks) / 100);
        let grade = finalScore >= (activeExamData.totalMarks * 0.8) ? 'A+' : (finalScore >= (activeExamData.totalMarks * 0.5) ? 'B' : 'C');
        let dateStr = new Date().toLocaleDateString();

        let results = JSON.parse(localStorage.getItem('results'));
        results.push({ student: currentUser.name, examType: activeExamData.examType, subject: activeExamData.subject, score: finalScore, total: activeExamData.totalMarks, grade, date: dateStr });
        localStorage.setItem('results', JSON.stringify(results));

        let slip = `CHINDWIN FUTURE BRIGHT SCHOOL
--------------------------------
EXAM RESULT SLIP (FINAL SUBMIT)
--------------------------------
Student : ${currentUser.name}
Roll No : ${currentUser.roll || 'CFBS-001'}
Exam    : ${activeExamData.examType}
Subject : ${activeExamData.subject}
Score   : ${finalScore} / ${activeExamData.totalMarks}
Grade   : ${grade}
Date    : ${dateStr}
--------------------------------
Thermal Printer Ready`;

        document.getElementById('roleContent').innerHTML = `
            <p style="color: #69F0AE; text-align: center; font-weight: bold; font-size:16px;">စာမေးပွဲ အောင်မြင်စွာ တင်သွင်းပြီးပါပြီ (Submitted)!</p>
            <div class="receipt printable-receipt">${slip}</div>
            <button onclick="window.print()" style="background-color: #69F0AE; color: #0A192F;">🖨️ 2-inch Thermal Printer ဖြင့် Print ထုတ်မည်</button>
            <button onclick="loadDashboard()" style="margin-top:10px;">ပင်မစာမျက်နှာသို့ ပြန်ရန်</button>
        `;
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function logout() {
        currentUser = null;
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginMsg').innerText = '';
        document.getElementById('portalSub').innerText = 'SMART EXAMINATION SYSTEM';
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
    }
</script>
