
name: Build CFBS Smart Examination APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Debug Repository Files
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== ROOT FILES ====="
          ls -la

          echo "===== SEARCH PROJECT FILES ====="
          find . -maxdepth 5 -type f \( \
            -name "pubspec.yaml" -o \
            -name "index.html" -o \
            -name "main.dart" \
          \) -print

          echo "===== CHECK REQUIRED FILES ====="

          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found"
            exit 1
          }

          test -f index.html || {
            echo "ERROR: index.html not found"
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart not found"
            exit 1
          }

          echo "All project files found!"

      - name: Create Android Project
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create \
              --project-name smart_exam \
              --platforms=android \
              --org com.cfbs \
              .
          fi

      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_gradle = Path("android/app/build.gradle")

          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")

          if not app_gradle.exists():
              raise SystemExit("Android app Gradle file not found")

          content = app_gradle.read_text()

          content = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              content
          )

          content = re.sub(
              r'compileSdkVersion\s+flutter\.compileSdkVersion',
              'compileSdkVersion 36',
              content
          )

          content = re.sub(
              r'compileSdk\s*=\s*34',
              'compileSdk = 36',
              content
          )

          content = re.sub(
              r'compileSdkVersion\s+34',
              'compileSdkVersion 36',
              content
          )

          app_gradle.write_text(content)

          print("Android compileSdk configured.")
          PY

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Examination-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
