
name: Build CFBS Smart Examination APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Check project files
      - name: Check Project Files
        run: |
          echo "Checking project files..."

          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found"
            exit 1
          }

          test -f index.html || {
            echo "ERROR: index.html not found"
            exit 1
          }

          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart not found"
            exit 1
          }

          echo "Project files found."

      # 5. Create Android project
      - name: Create Android Project
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create \
              --project-name smart_exam \
              --platforms=android \
              --org com.cfbs \
              .
          fi

      # 6. Configure Android SDK
      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app_gradle = Path("android/app/build.gradle")

          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")

          if not app_gradle.exists():
              raise SystemExit("Android app Gradle file not found")

          content = app_gradle.read_text()

          content = re.sub(
              r'compileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              content
          )

          content = re.sub(
              r'compileSdkVersion\s+flutter\.compileSdkVersion',
              'compileSdkVersion 36',
              content
          )

          content = re.sub(
              r'compileSdk\s*=\s*34',
              'compileSdk = 36',
              content
          )

          content = re.sub(
              r'compileSdkVersion\s+34',
              'compileSdkVersion 36',
              content
          )

          app_gradle.write_text(content)

          print("Android compileSdk configured.")

          PY

      # 7. Install dependencies
      - name: Get Flutter Dependencies
        run: flutter pub get

      # 8. Check Flutter project
      - name: Flutter Analyze
        run: flutter analyze
        continue-on-error: true

      # 9. Build APK
      - name: Build Release APK
        run: flutter build apk --release

      # 10. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Examination-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
