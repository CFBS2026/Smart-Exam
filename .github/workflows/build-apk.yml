      - name: Diagnose Project Files
        shell: bash
        run: |
          echo "===== ROOT FILES ====="
          ls -lab

          echo "===== EXACT FILENAMES ====="
          python3 - <<'PY'
          import os

          for name in os.listdir("."):
              print(repr(name), "FILE:", os.path.isfile(name))

          required = ["pubspec.yaml", "index.html", "lib/main.dart"]

          for name in required:
              print(name, "=>", os.path.isfile(name))
          PY

          echo "===== CHECK FILES ====="
          test -f index.html
          test -f lib/main.dart
          test -f pubspec.yaml
          echo "All source files found."