name: Build CFBS Smart Examination APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Normalize Filenames and Verify Project Files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path(".")

          for p in list(root.iterdir()):
              if p.is_file():
                  clean_name = p.name.strip()
                  if clean_name != p.name:
                      target = root / clean_name
                      shutil.move(str(p), str(target))
                      print(f"Renamed '{p.name}' -> '{clean_name}'")

          pubspec_space = root / "pubspec.yaml "
          if pubspec_space.exists() and not (root / "pubspec.yaml").exists():
              shutil.move(str(pubspec_space), str(root / "pubspec.yaml"))
              print("Fixed trailing space on pubspec.yaml")

          print("===== ROOT FILES =====")
          for item in sorted(root.iterdir(), key=lambda x: x.name):
              size = item.stat().st_size if item.is_file() else 0
              tag = "[DIR] " if item.is_dir() else "[FILE]"
              print(f"{tag} {item.name} ({size} bytes)")

          print("===== CHECK REQUIRED FILES =====")
          required = ["pubspec.yaml", "index.html", "lib/main.dart"]
          missing = [f for f in required if not (root / f).is_file()]
          if missing:
              raise SystemExit(f"ERROR: Missing required files: {', '.join(missing)}")

          for f in required:
              print(f"FOUND: {f}")

          if (root / "app_icon.png").is_file():
              print("FOUND: app_icon.png")
          else:
              print("OPTIONAL MISSING: app_icon.png")

          print("All required project files found!")
          PY

      - name: Create Android Project
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create \
              --project-name smart_exam \
              --platforms=android \
              --org com.cfbs \
              .
          fi

      - name: Configure App Icon
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          if Path("app_icon.png").exists():
              subprocess.run(["flutter", "pub", "add", "--dev", "flutter_launcher_icons"], check=True)
              icon_lines = [
                  "flutter_launcher_icons:",
                  "  android: true",
                  "  ios: false",
                  '  image_path: "app_icon.png"',
                  "  min_sdk_android: 21",
                  "",
              ]
              Path("flutter_launcher_icons.yaml").write_text("\n".join(icon_lines), encoding="utf-8")
              res = subprocess.run(["dart", "run", "flutter_launcher_icons"], check=False)
              if res.returncode != 0:
                  print("Warning: flutter_launcher_icons exited with non-zero; continuing build.")
          else:
              print("app_icon.png not found; skipping launcher icons.")
          PY

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Configure Android SDK, Plugins and Lint
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          TARGET_SDK = 37

          def patch_sdk_text(text: str, sdk: int = TARGET_SDK) -> str:
              text = re.sub(
                  r'(\bcompileSdk\s*=?\s*)(flutter\.compileSdkVersion(?:\.toInt\(\))?|\d+|"android-\d+"|\'android-\d+\')',
                  rf'\g<1>{sdk}',
                  text,
              )
              text = re.sub(
                  r'(\bcompileSdkVersion\s*=?\s*)(flutter\.compileSdkVersion(?:\.toInt\(\))?|\d+|"android-\d+"|\'android-\d+\')',
                  rf'\g<1>{sdk}',
                  text,
              )
              return text

          for candidate in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if candidate.exists():
                  before = candidate.read_text(encoding="utf-8", errors="ignore")
                  after = patch_sdk_text(before, TARGET_SDK)
                  if after != before:
                      candidate.write_text(after, encoding="utf-8")
                      print("Updated:", candidate)

          pub_cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          search_roots = [Path("android")]
          if pub_cache.exists():
              search_roots.append(pub_cache)

          patched_count = 0
          for base in search_roots:
              for gfile in base.rglob("build.gradle*"):
                  g_posix = gfile.as_posix()
                  if "/build/" in g_posix or g_posix.startswith("build/"):
                      continue
                  if base == pub_cache and "file_picker" not in g_posix:
                      continue
                  try:
                      before = gfile.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  after = patch_sdk_text(before, TARGET_SDK)
                  if after != before:
                      gfile.write_text(after, encoding="utf-8")
                      patched_count += 1
                      print("Patched:", gfile)

          init_dir = Path.home() / ".gradle" / "init.d"
          init_dir.mkdir(parents=True, exist_ok=True)
          init_script = init_dir / "force_sdk.gradle"

          gradle_code = """
          gradle.projectsEvaluated { rootProject ->
              rootProject.allprojects { proj ->
                  proj.plugins.withId("com.android.library") {
                      def androidExt = proj.extensions.findByName("android")
                      if (androidExt != null) {
                          try {
                              androidExt.compileSdk = 37
                          } catch (Throwable ignored) {}
                          try {
                              androidExt.compileSdkVersion(37)
                          } catch (Throwable ignored) {}
                      }
                  }
                  proj.plugins.withId("com.android.application") {
                      def androidExt = proj.extensions.findByName("android")
                      if (androidExt != null) {
                          try {
                              androidExt.compileSdk = 37
                          } catch (Throwable ignored) {}
                          try {
                              androidExt.compileSdkVersion(37)
                          } catch (Throwable ignored) {}
                      }
                  }
                  proj.tasks.configureEach { task ->
                      if (task.name.startsWith("lintVital")) {
                          task.enabled = false
                      }
                  }
              }
          }
          """.replace("          ", "")

          init_script.write_text(gradle_code.strip() + "\n", encoding="utf-8")
          print(f"Configured SDK {TARGET_SDK} and init script ({patched_count} files patched).")
          PY

      - name: Configure Android Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              content = manifest.read_text(encoding="utf-8")
              permission = '<uses-permission android:name="android.permission.INTERNET"/>'
              if permission not in content:
                  content = content.replace(
                      "<application",
                      permission + "\n    <application",
                      1,
                  )
                  manifest.write_text(content, encoding="utf-8")
          PY

      - name: Flutter Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Examination-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
