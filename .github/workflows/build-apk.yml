name: Build CFBS Smart Examination APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Normalize Filenames and Verify Project Files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path(".")

          for p in list(root.iterdir()):
              if p.is_file():
                  clean_name = p.name.strip()
                  if clean_name != p.name:
                      target = root / clean_name
                      shutil.move(str(p), str(target))
                      print(f"Renamed '{p.name}' -> '{clean_name}'")

          pubspec_space = root / "pubspec.yaml "
          if pubspec_space.exists() and not (root / "pubspec.yaml").exists():
              shutil.move(str(pubspec_space), str(root / "pubspec.yaml"))
              print("Fixed trailing space on pubspec.yaml")

          print("===== ROOT FILES =====")
          for item in sorted(root.iterdir(), key=lambda x: x.name):
              size = item.stat().st_size if item.is_file() else 0
              tag = "[DIR] " if item.is_dir() else "[FILE]"
              print(f"{tag} {item.name} ({size} bytes)")

          print("===== CHECK REQUIRED FILES =====")
          required = ["pubspec.yaml", "index.html", "lib/main.dart"]
          missing = [f for f in required if not (root / f).is_file()]
          if missing:
              raise SystemExit(f"ERROR: Missing required files: {', '.join(missing)}")

          for f in required:
              print(f"FOUND: {f}")

          if (root / "app_icon.png").is_file():
              print("FOUND: app_icon.png")
          else:
              print("OPTIONAL MISSING: app_icon.png")

          print("All required project files found!")
          PY

      - name: Create Android Project
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create \
              --project-name smart_exam \
              --platforms=android \
              --org com.cfbs \
              .
          fi

      - name: Configure Android SDK and Lint
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          TARGET_SDK = 37

          def patch_sdk_text(text: str, sdk: int = TARGET_SDK) -> str:
              text = re.sub(r'\bcompileSdk\s*=\s*flutter\.compileSdkVersion\b', f'compileSdk = {sdk}', text)
              text = re.sub(r'\bcompileSdkVersion\s+flutter\.compileSdkVersion\b', f'compileSdkVersion {sdk}', text)
              text = re.sub(r'\bcompileSdk\s*=\s*\d+\b', f'compileSdk = {sdk}', text)
              text = re.sub(r'\bcompileSdkVersion\s+\d+\b', f'compileSdkVersion {sdk}', text)
              text = re.sub(r'\bcompileSdk\s*=\s*android-\d+', f'compileSdk = {sdk}', text)
              return text

          app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")
          if not app_gradle.exists():
              raise SystemExit("Android app Gradle file not found")

          app_gradle.write_text(patch_sdk_text(app_gradle.read_text(), TARGET_SDK))

          # Patch pub-cache plugins (such as file_picker) and any local gradle files
          pub_cache = Path(os.environ.get("PUB_CACHE", Path.home() / ".pub-cache"))
          search_roots = [Path("android")]
          if pub_cache.exists():
              search_roots.append(pub_cache)

          patched_files = []
          for base in search_roots:
              for gfile in base.rglob("build.gradle*"):
                  g_posix = gfile.as_posix()
                  if "/build/" in g_posix or g_posix.startswith("build/"):
                      continue
                  if base == pub_cache and "file_picker" not in g_posix:
                      continue
                  try:
                      before = gfile.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  after = patch_sdk_text(before, TARGET_SDK)
                  if after != before:
                      gfile.write_text(after, encoding="utf-8")
                      patched_files.append(str(gfile))

          for pf in patched_files:
              print("Patched:", pf)

          root_gradle = Path("android/build.gradle")
          if not root_gradle.exists():
              root_gradle = Path("android/build.gradle.kts")
          if not root_gradle.exists():
              raise SystemExit("Android root Gradle file not found")

          if root_gradle.suffix == ".kts":
              extra_lines = [
                  "",
                  "// Force subproject compileSdk to 37 and disable release lint tasks.",
                  "gradle.projectsEvaluated {",
                  "    rootProject.subprojects.forEach { sub ->",
                  '        val ext = sub.extensions.findByName("android")',
                  "        if (ext != null) {",
                  "            try {",
                  '                val prop = ext.javaClass.getMethod("setCompileSdk", Int::class.javaPrimitiveType)',
                  "                prop.invoke(ext, 37)",
                  "            } catch (_: Exception) {",
                  "                try {",
                  '                    val prop2 = ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType)',
                  "                    prop2.invoke(ext, 37)",
                  "                } catch (_: Exception) {}",
                  "            }",
                  "        }",
                  "    }",
                  "}",
                  "subprojects {",
                  "    tasks.configureEach {",
                  '        if (name.startsWith("lintVital")) {',
                  "            enabled = false",
                  "        }",
                  "    }",
                  "}",
                  "",
              ]
          else:
              extra_lines = [
                  "",
                  "// Force subproject compileSdk to 37 and disable release lint tasks.",
                  "gradle.projectsEvaluated {",
                  "    rootProject.subprojects.each { sub ->",
                  "        def ext = sub.extensions.findByName('android')",
                  "        if (ext != null) {",
                  "            try {",
                  "                ext.compileSdk = 37",
                  "            } catch (Exception ignored) {",
                  "                try {",
                  "                    ext.compileSdkVersion 37",
                  "                } catch (Exception ignored2) {}",
                  "            }",
                  "        }",
                  "    }",
                  "}",
                  "subprojects {",
                  "    tasks.configureEach {",
                  "        if (name.startsWith('lintVital')) {",
                  "            enabled = false",
                  "        }",
                  "    }",
                  "}",
                  "",
              ]

          root_content = root_gradle.read_text(encoding="utf-8")
          if "Force subproject compileSdk to 37" not in root_content:
              root_gradle.write_text(root_content + "\n".join(extra_lines), encoding="utf-8")

          print(f"Android SDK ({TARGET_SDK}) and lint configured. Total patched: {len(patched_files)}")
          PY


      - name: Configure App Icon
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          if Path("app_icon.png").exists():
              subprocess.run(["flutter", "pub", "add", "--dev", "flutter_launcher_icons"], check=True)
              icon_lines = [
                  "flutter_launcher_icons:",
                  "  android: true",
                  "  ios: false",
                  '  image_path: "app_icon.png"',
                  "  min_sdk_android: 21",
                  "",
              ]
              Path("flutter_launcher_icons.yaml").write_text("\n".join(icon_lines))
              subprocess.run(["dart", "run", "flutter_launcher_icons"], check=True)
          else:
              print("app_icon.png not found; skipping launcher icons.")
          PY

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Examination-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
