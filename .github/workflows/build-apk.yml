name: Build CFBS Smart Exam APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix and Verify Files
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import unicodedata

          def normalize(name):
              name = unicodedata.normalize("NFKC", name)
              return "".join(
                  c for c in name
                  if not c.isspace()
                  and unicodedata.category(c) not in ("Cf", "Cc")
              ).lower()

          matches = [
              n for n in os.listdir(".")
              if normalize(n) == "pubspec.yaml"
              and os.path.isfile(n)
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "Expected one pubspec.yaml; found: " + repr(matches)
              )

          if matches[0] != "pubspec.yaml":
              os.rename(matches[0], "pubspec.yaml")

          with open("pubspec.yaml", encoding="utf-8-sig") as f:
              content = f.read()

          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)

          required = [
              "pubspec.yaml",
              "index.html",
              "lib/main.dart",
              "app_icon.png"
          ]

          for path in required:
              if not os.path.isfile(path):
                  raise SystemExit("MISSING: " + path)
              print("FOUND:", path)

          print("Project files verified.")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Folder
        run: |
          flutter create \
            --platforms=android \
            --project-name smart_exam \
            --org com.cfbs \
            --no-pub \
            /tmp/smart_exam_template

          cp -R /tmp/smart_exam_template/android ./android

          echo "Android project generated."

      - name: Set Android Compile SDK 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          gradle = next((p for p in files if p.exists()), None)

          if gradle is None:
              raise SystemExit("Android app Gradle file not found.")

          content = gradle.read_text()

          if gradle.name.endswith(".kts"):
              content, count = re.subn(
                  r'compileSdk\s*=\s*[^\n]+',
                  'compileSdk = 36',
                  content,
                  count=1
              )
          else:
              content, count = re.subn(
                  r'compileSdkVersion\s+.*',
                  'compileSdkVersion 36',
                  content,
                  count=1
              )

              if count == 0:
                  content, count = re.subn(
                      r'compileSdk\s+.*',
                      'compileSdk 36',
                      content,
                      count=1
                  )

          if count == 0:
              raise SystemExit("Could not update compileSdk.")

          gradle.write_text(content)
          print("compileSdk updated to 36.")
          PY

      - name: Configure App Icon
        run: |
          flutter pub add --dev flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "app_icon.png"
            adaptive_icon_background: "#0A192F"
            adaptive_icon_foreground: "app_icon.png"
          EOF

          dart run flutter_launcher_icons

          echo "CFBS App Icon configured."

      - name: Configure Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          p.write_text(s)
          print("Internet permission added.")
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Exam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14