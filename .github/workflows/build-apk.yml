
name: Build CFBS Smart Exam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android Project
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.cfbs.smart_exam .
          fi

      - name: Configure Android SDK and Lint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")

          if not app_gradle.exists():
              raise SystemExit("Android app Gradle file not found")

          content = app_gradle.read_text()
          content = content.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          content = content.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
          content = content.replace("compileSdk = 34", "compileSdk = 36")
          content = content.replace("compileSdkVersion 34", "compileSdkVersion 36")
          app_gradle.write_text(content)

          print("Android SDK configuration completed.")
          PY

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Exam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
