name: Build CFBS Smart Exam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      
      - name: Verify Project Files
        run: |
          echo "Checking project files..."
          for file in pubspec.yaml index.html lib/main.dart app_icon.png; do
            if [ -f "$file" ]; then
              echo "FOUND: $file"
            else
              echo "MISSING: $file"
            fi
          done
          echo ""
          echo "Repository file list:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Java Versions
        run: |
          flutter --version
          java -version

      - name: Generate Android Project
        run: |
          flutter create \
            --platforms=android \
            --project-name smart_exam \
            --org com.cfbs \
            --no-pub \
            /tmp/smart_exam_template

          cp -r /tmp/smart_exam_template/android ./android

      - name: Configure Android SDK and Lint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_gradle = Path("android/app/build.gradle")
          if not app_gradle.exists():
              app_gradle = Path("android/app/build.gradle.kts")

          if not app_gradle.exists():
              raise SystemExit("Android app Gradle file not found")

          content = app_gradle.read_text()

          content = content.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36"
          )
          content = content.replace(
              "compileSdkVersion flutter.compileSdkVersion",
              "compileSdkVersion 36"
          )

          app_gradle.write_text(content)

          root_gradle = Path("android/build.gradle")

          if not root_gradle.exists():
              raise SystemExit("android/build.gradle not found")

          lint_config = """
          
          // Disable release lint tasks to avoid the webview plugin lint crash.
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          """

          root_content = root_gradle.read_text()

          if "Disable release lint tasks" not in root_content:
              root_gradle.write_text(root_content + lint_config)

          print("Android SDK and lint configuration completed.")
          PY

      - name: Configure App Icon
        run: |
          flutter pub add --dev flutter_launcher_icons

          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "app_icon.png"
            min_sdk_android: 21
          EOF

          dart run flutter_launcher_icons

      - name: Configure Android Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in content:
              content = content.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          manifest.write_text(content)
          PY

      - name: Get Flutter Dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Exam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error