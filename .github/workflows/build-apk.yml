
name: Build CFBS Smart Examination APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Normalize filenames and verify
      - name: Normalize Filenames and Verify Project Files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path(".")

          for p in list(root.iterdir()):
              if p.is_file():
                  clean_name = p.name.strip()
                  if clean_name != p.name:
                      target = root / clean_name
                      if target.exists():
                          raise SystemExit(f"Duplicate filename: {clean_name}")
                      shutil.move(str(p), str(target))
                      print(f"Renamed: {p.name} -> {clean_name}")

          print("===== ROOT FILES =====")
          for item in sorted(root.iterdir(), key=lambda x: x.name):
              print(item.name)

          required = [
              "pubspec.yaml",
              "index.html",
              "lib/main.dart"
          ]

          missing = [
              f for f in required
              if not (root / f).is_file()
          ]

          if missing:
              raise SystemExit(
                  "Missing files: " + ", ".join(missing)
              )

          print("All required project files found!")
          PY

      # 5. Create Android project if missing
      - name: Create Android Project
        run: |
          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then

            flutter create \
              --project-name smart_exam \
              --platforms=android \
              --org com.cfbs \
              .
          else
            echo "Android project already exists."
          fi

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install Android API 36
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # 8. Configure app Compile SDK
      - name: Configure App Compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle")

          if not app.exists():
              app = Path("android/app/build.gradle.kts")

          if not app.exists():
              raise SystemExit("Android app Gradle file not found")

          content = app.read_text()

          content = re.sub(
              r'\bcompileSdk\s*=\s*flutter\.compileSdkVersion',
              'compileSdk = 36',
              content
          )

          content = re.sub(
              r'\bcompileSdkVersion\s+flutter\.compileSdkVersion',
              'compileSdkVersion 36',
              content
          )

          content = re.sub(
              r'\bcompileSdk\s*=\s*\d+',
              'compileSdk = 36',
              content
          )

          content = re.sub(
              r'\bcompileSdkVersion\s+\d+',
              'compileSdkVersion 36',
              content
          )

          app.write_text(content)

          print("App compileSdk configured to 36.")
          PY

      # 9. Get Flutter dependencies
      - name: Get Flutter Dependencies
        run: flutter pub get

      # 10. Fix Android Plugin Compile SDK
      - name: Configure Plugin Compile SDK 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          pub_cache = Path(
              os.environ.get(
                  "PUB_CACHE",
                  str(Path.home() / ".pub-cache")
              )
          )

          if not pub_cache.exists():
              raise SystemExit("Flutter PUB_CACHE not found")

          def patch_compile_sdk(content):
              content = re.sub(
                  r'\bcompileSdk\s*=\s*flutter\.compileSdkVersion',
                  'compileSdk = 36',
                  content
              )

              content = re.sub(
                  r'\bcompileSdkVersion\s+flutter\.compileSdkVersion',
                  'compileSdkVersion 36',
                  content
              )

              content = re.sub(
                  r'\bcompileSdk\s*=\s*\d+',
                  'compileSdk = 36',
                  content
              )

              content = re.sub(
                  r'\bcompileSdkVersion\s*\(?\s*\d+\s*\)?',
                  'compileSdkVersion 36',
                  content
              )

              return content

          patched = 0

          for gradle in pub_cache.rglob("build.gradle*"):

              if gradle.parent.name != "android":
                  continue

              original = gradle.read_text(
                  encoding="utf-8"
              )

              updated = patch_compile_sdk(original)

              if updated != original:
                  gradle.write_text(
                      updated,
                      encoding="utf-8"
                  )

                  patched += 1
                  print("Patched:", gradle)

          print(
              f"Plugin Gradle files patched: {patched}"
          )
          print("Plugin Compile SDK configuration completed.")
          PY

      # 11. Optional App Icon
      - name: Configure App Icon
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          if Path("app_icon.png").exists():

              subprocess.run(
                  [
                      "flutter",
                      "pub",
                      "add",
                      "--dev",
                      "flutter_launcher_icons"
                  ],
                  check=True
              )

              config = [
                  "flutter_launcher_icons:",
                  "  android: true",
                  "  ios: false",
                  '  image_path: "app_icon.png"',
                  "  min_sdk_android: 21",
                  ""
              ]

              Path(
                  "flutter_launcher_icons.yaml"
              ).write_text("\n".join(config))

              subprocess.run(
                  [
                      "dart",
                      "run",
                      "flutter_launcher_icons"
                  ],
                  check=True
              )

              print("App icon configured.")

          else:
              print("No app_icon.png. Skipping icon setup.")
          PY

      # 12. Flutter Analyze
      - name: Flutter Analyze
        run: flutter analyze
        continue-on-error: true

      # 13. Build APK
      - name: Build Release APK
        run: flutter build apk --release

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Examination-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
