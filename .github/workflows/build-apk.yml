
name: Build CFBS Smart Exam APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Fix filename and check source files
      - name: Prepare Flutter Project
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import unicodedata

          def normalize(name):
              name = unicodedata.normalize("NFKC", name)
              return "".join(
                  c for c in name
                  if not c.isspace()
                  and unicodedata.category(c) not in ("Cf", "Cc")
              ).lower()

          matches = [
              n for n in os.listdir(".")
              if normalize(n) == "pubspec.yaml"
              and os.path.isfile(n)
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: pubspec.yaml matches: " + repr(matches)
              )

          if matches[0] != "pubspec.yaml":
              os.rename(matches[0], "pubspec.yaml")

          with open("pubspec.yaml", encoding="utf-8-sig") as f:
              content = f.read()

          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)

          for path in [
              "pubspec.yaml",
              "index.html",
              "lib/main.dart"
          ]:
              if not os.path.isfile(path):
                  raise SystemExit("MISSING FILE: " + path)
              print("FOUND:", path)

          print("Source files verified.")
          PY

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate Android folder FIRST
      - name: Generate Android Project
        shell: bash
        run: |
          flutter create \
            --platforms=android \
            --project-name smart_exam \
            --org com.cfbs \
            --no-pub \
            /tmp/smart_exam_template

          cp -R /tmp/smart_exam_template/android ./android

          echo "Android folder created."
          test -f android/app/src/main/AndroidManifest.xml

      # Configure Internet
      - name: Configure Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in s:
              s = s.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          p.write_text(s, encoding="utf-8")
          print("Internet permission configured.")
          PY

      # Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Build APK
      - name: Build Release APK
        run: flutter build apk --release

      # Verify APK
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Exam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
