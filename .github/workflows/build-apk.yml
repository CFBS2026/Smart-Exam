
name: Build CFBS Smart Exam APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose Project Files
        shell: bash
        run: |
          echo "===== ROOT FILES ====="
          ls -lab
          python3 - <<'PY'
          import os
          for name in os.listdir("."):
              print(repr(name), "FILE:", os.path.isfile(name))
          PY
      - name: Check Required Files
        shell: bash
        run: |
          echo "PUBSPEC:"
          if [ -f pubspec.yaml ]; then echo "FOUND"; else echo "MISSING"; fi

          echo "HTML:"
          if [ -f index.html ]; then echo "FOUND"; else echo "MISSING"; fi

          echo "MAIN DART:"
          if [ -f lib/main.dart ]; then echo "FOUND"; else echo "MISSING"; fi

          echo "LIB FOLDER:"
          ls -la lib/ || true
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Project
        run: |
          flutter create --platforms=android --project-name smart_exam --org com.cfbs --no-pub _android_template
          cp -R _android_template/android ./android
          rm -rf _android_template

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Exam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
