
name: Build Smart Exam APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Smart Exam Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Project Files
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          echo "Repository files:"
          ls -la

          if [ ! -f "./pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml is missing from repository root."
            exit 1
          fi

          if [ ! -f "./lib/main.dart" ]; then
            echo "ERROR: lib/main.dart is missing."
            exit 1
          fi

          echo "Flutter project files found."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Packages
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload Smart Exam APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Exam-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
