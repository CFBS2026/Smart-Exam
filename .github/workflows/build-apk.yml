
name: Build CFBS Smart Exam APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Fix and Verify Project Files
      - name: Fix Project Files
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import unicodedata

          print("===== ORIGINAL FILES =====")
          for name in os.listdir("."):
              print(repr(name))

          def normalize(name):
              name = unicodedata.normalize("NFKC", name)
              return "".join(
                  c for c in name
                  if unicodedata.category(c) not in ("Cf", "Cc")
                  and not c.isspace()
              ).lower()

          matches = [
              name for name in os.listdir(".")
              if normalize(name) == "pubspec.yaml"
              and os.path.isfile(name)
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "ERROR: Expected one pubspec.yaml file, found "
                  + str(len(matches))
              )

          source = matches[0]

          if source != "pubspec.yaml":
              os.rename(source, "pubspec.yaml")
              print("Corrected filename:", repr(source))

          with open("pubspec.yaml", "r", encoding="utf-8-sig") as f:
              content = f.read()

          with open("pubspec.yaml", "w", encoding="utf-8") as f:
              f.write(content)

          required = [
              "pubspec.yaml",
              "index.html",
              "lib/main.dart",
              "android/app/src/main/AndroidManifest.xml"
          ]

          print("===== VERIFY FILES =====")

          for path in required:
              if not os.path.isfile(path):
                  raise SystemExit("MISSING FILE: " + path)
              print("FOUND:", path)

          print("All required files verified.")
          PY

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 5. Add Internet Permission
      - name: Configure Android Internet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")

          permission = (
              '<uses-permission android:name="android.permission.INTERNET"/>'
          )

          if permission not in s:
              s = s.replace(
                  '<application',
                  permission + '\n    <application',
                  1
              )

          p.write_text(s, encoding="utf-8")
          print("Internet permission configured.")
          PY

      # 6. Install Packages
      - name: Install Dependencies
        run: flutter pub get

      # 7. Build Release APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Verify APK
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CFBS-Smart-Exam-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
